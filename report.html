<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FleetSHE — รายงาน</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">🚗</div><div><div class="logo-name">FleetSHE</div><div class="logo-sub">ระบบบริหารรถยนต์</div></div></div>
  <div class="nav-group-label">เมนูหลัก</div>
  <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Dashboard</a>
  <a href="vehicles.html" class="nav-item"><span class="nav-icon">🚗</span>รถยนต์</a>
  <a href="maintenance.html" class="nav-item"><span class="nav-icon">🔧</span>บำรุงรักษา</a>
  <div class="nav-group-label">ข้อมูล</div>
  <a href="drivers.html" class="nav-item"><span class="nav-icon">👤</span>ผู้ขับขี่</a>
  <a href="service.html" class="nav-item"><span class="nav-icon">📋</span>ประวัติซ่อม</a>
  <a href="report.html" class="nav-item active"><span class="nav-icon">📊</span>รายงาน</a>
  <div class="sidebar-footer"><div class="sf-name" id="sf-name">—</div><div class="sf-role" id="sf-role">—</div></div>
</nav>
<main class="main">
  <header class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="topbar-title">รายงาน Audit</span>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="exportCSV()" title="Export CSV">📥</button>
    </div>
  </header>
  <div class="page-body">
    <!-- Filter -->
    <div class="card" style="margin-bottom:14px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group" style="margin:0">
          <label class="form-label">ศูนย์วิจัย</label>
          <select class="form-select" id="rpt-center">
            <option value="ALL">ทุกศูนย์</option>
          </select>
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">ประเภทรายงาน</label>
          <select class="form-select" id="rpt-type">
            <option value="audit">Audit ตามแผน</option>
            <option value="vehicles">รายงานรายคัน</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary btn-block mt-12" onclick="loadReport()">🔍 ดูรายงาน</button>
    </div>
    <div id="report-area"><div class="empty-state"><div class="empty-icon">📊</div>เลือกตัวกรองแล้วกด "ดูรายงาน"</div></div>
  </div>
</main>
<nav class="bottom-nav">
  <a href="index.html" class="bnav-item"><div class="bnav-icon-wrap">🏠</div><span>หน้าหลัก</span></a>
  <a href="vehicles.html" class="bnav-item"><div class="bnav-icon-wrap">🚗</div><span>รถยนต์</span></a>
  <a href="maintenance.html" class="bnav-item"><div class="bnav-icon-wrap">🔧</div><span>บำรุงรักษา</span></a>
  <a href="drivers.html" class="bnav-item"><div class="bnav-icon-wrap">👤</div><span>ผู้ขับขี่</span></a>
  <a href="report.html" class="bnav-item active"><div class="bnav-icon-wrap">📊</div><span>รายงาน</span></a>
</nav>
</div>
<style>
.report-table{width:100%;border-collapse:collapse;font-size:12px;}
.report-table th{background:var(--primary);color:#fff;padding:10px 8px;text-align:left;font-weight:500;white-space:nowrap;}
.report-table td{padding:9px 8px;border-bottom:1px solid var(--border-light);vertical-align:top;}
.report-table tr:hover td{background:var(--bg);}
.on-time{color:var(--green);font-weight:500;}
.late{color:var(--red);font-weight:500;}
</style>
<script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script>
<script>
var reportData=null;
var MLABEL={INITIAL_1000KM:'1,000 กม.',ROUTINE_10K:'10,000 กม./6 เดือน',TIRE_ROTATION:'สลับยาง',TIRE_REPLACEMENT:'เปลี่ยนยาง',BATTERY_REPLACEMENT:'แบตเตอรี่'};
document.addEventListener('DOMContentLoaded',function(){
  requireAuth();
  var u=Auth.getUser();
  if(u){document.getElementById('sf-name').textContent=u.name;document.getElementById('sf-role').textContent=roleLabel(u.role);}
  loadCenters();
});
function loadCenters(){
  API.call('getCenters').then(function(r){
    if(!r.success)return;
    var sel=document.getElementById('rpt-center');
    r.data.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
  });
}
function loadReport(){
  var cid=document.getElementById('rpt-center').value;
  document.getElementById('report-area').innerHTML='<div class="loading-state">⏳ กำลังสร้างรายงาน...</div>';
  API.call('getAuditReport',{centerId:cid}).then(function(r){
    if(!r.success){document.getElementById('report-area').innerHTML='<div class="empty-state">เกิดข้อผิดพลาด</div>';return;}
    reportData=r.data||[];
    renderAuditReport(reportData);
  });
}
function renderAuditReport(data){
  if(!data.length){document.getElementById('report-area').innerHTML='<div class="empty-state"><div class="empty-icon">📋</div>ไม่พบข้อมูล</div>';return;}
  var rows=[];
  data.forEach(function(v){
    (v.items||[]).forEach(function(item){
      rows.push({plate:v.plateNumber,center:v.centerName,type:MLABEL[item.type]||item.type,
        lastService:item.lastService?thaiDate(item.lastService):'ยังไม่เคย',
        onTime:item.onTime===null?'—':item.onTime?'<span class="on-time">✅ ตามแผน</span>':'<span class="late">❌ ล่าช้า</span>',
        delayDays:item.delayDays!=null&&item.delayDays>0?item.delayDays+' วัน':'—',
        delayKm:item.delayKm!=null&&item.delayKm>0?item.delayKm+' กม.':'—',
        status:item.status});
    });
  });
  var html='<div style="overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);">'
    +'<table class="report-table">'
    +'<thead><tr><th>ทะเบียน</th><th>ศูนย์</th><th>ประเภทงาน</th><th>เข้ารับบริการล่าสุด</th><th>ตามแผน</th><th>ล่าช้า (วัน)</th><th>ล่าช้า (กม.)</th></tr></thead>'
    +'<tbody>'+rows.map(function(r){
      return '<tr><td style="font-weight:600">'+r.plate+'</td><td>'+r.center+'</td><td>'+r.type+'</td><td>'+r.lastService+'</td><td>'+r.onTime+'</td><td>'+r.delayDays+'</td><td>'+r.delayKm+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  document.getElementById('report-area').innerHTML=html;
}
function exportCSV(){
  if(!reportData){alert('กรุณาโหลดรายงานก่อน');return;}
  var rows=[['ทะเบียน','ศูนย์','ประเภทงาน','เข้ารับบริการล่าสุด','ตามแผน','ล่าช้า(วัน)','ล่าช้า(กม.)']];
  reportData.forEach(function(v){
    (v.items||[]).forEach(function(item){
      rows.push([v.plateNumber,v.centerName,MLABEL[item.type]||item.type,item.lastService||'ยังไม่เคย',item.onTime===null?'—':item.onTime?'ตามแผน':'ล่าช้า',item.delayDays>0?item.delayDays:'—',item.delayKm>0?item.delayKm:'—']);
    });
  });
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fleet_audit_'+new Date().toISOString().split('T')[0]+'.csv';a.click();
}
function thaiDate(str){if(!str)return '—';try{var d=new Date(str);var m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return d.getDate()+' '+m[d.getMonth()]+' '+(d.getFullYear()+543);}catch(e){return str;}}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
</script>
</body>
</html>
