<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FleetSHE — บำรุงรักษา</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">🚗</div><div><div class="logo-name">FleetSHE</div><div class="logo-sub">ระบบบริหารรถยนต์</div></div></div>
  <div class="nav-group-label">เมนูหลัก</div>
  <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Dashboard</a>
  <a href="vehicles.html" class="nav-item"><span class="nav-icon">🚗</span>รถยนต์</a>
  <a href="maintenance.html" class="nav-item active"><span class="nav-icon">🔧</span>บำรุงรักษา</a>
  <div class="nav-group-label">ข้อมูล</div>
  <a href="drivers.html" class="nav-item"><span class="nav-icon">👤</span>ผู้ขับขี่</a>
  <a href="service.html" class="nav-item"><span class="nav-icon">📋</span>ประวัติซ่อม</a>
  <a href="report.html" class="nav-item"><span class="nav-icon">📊</span>รายงาน</a>
  <div class="sidebar-footer"><div class="sf-name" id="sf-name">—</div><div class="sf-role" id="sf-role">—</div><button onclick="Auth.logout()" style="margin-top:10px;width:100%;padding:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);border-radius:8px;font-size:13px;cursor:pointer;">🚪 ออกจากระบบ</button></div>
</nav>
<main class="main">
  <header class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="topbar-title">รอบบำรุงรักษา</span>
    <div class="topbar-actions">
      <select class="center-select" id="center-filter" onchange="loadData()">
        <option value="ALL">ทุกศูนย์</option>
      </select>
    </div>
  </header>
  <div class="page-body">
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;">
      <button class="filter-btn active" onclick="filterStatus('ALL',this)">ทั้งหมด</button>
      <button class="filter-btn" onclick="filterStatus('OVERDUE',this)">🔴 เกินกำหนด</button>
      <button class="filter-btn" onclick="filterStatus('DUE_SOON',this)">🟡 ใกล้ครบ</button>
      <button class="filter-btn" onclick="filterStatus('APPOINTED',this)">🔵 นัดแล้ว</button>
      <button class="filter-btn" onclick="filterStatus('NORMAL',this)">🟢 ปกติ</button>
    </div>
    <div id="maint-list" class="card-list"><div class="loading-state">⏳ กำลังโหลด...</div></div>
  </div>
</main>
<nav class="bottom-nav">
  <a href="index.html" class="bnav-item"><div class="bnav-icon-wrap">🏠</div><span>หน้าหลัก</span></a>
  <a href="vehicles.html" class="bnav-item"><div class="bnav-icon-wrap">🚗</div><span>รถยนต์</span></a>
  <a href="maintenance.html" class="bnav-item active"><div class="bnav-icon-wrap">🔧</div><span>บำรุงรักษา</span></a>
  <a href="drivers.html" class="bnav-item"><div class="bnav-icon-wrap">👤</div><span>ผู้ขับขี่</span></a>
  <a href="report.html" class="bnav-item"><div class="bnav-icon-wrap">📊</div><span>รายงาน</span></a>
</nav>
</div>
<style>
.filter-btn{padding:7px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:500;color:var(--text-2);white-space:nowrap;transition:all .15s;flex-shrink:0;}
.filter-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
</style>
<script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script>
<script>
var allItems=[];var currentFilter='ALL';
document.addEventListener('DOMContentLoaded',function(){
  requireAuth();
  var u=Auth.getUser();
  if(u){document.getElementById('sf-name').textContent=u.name;document.getElementById('sf-role').textContent=roleLabel(u.role);}
  loadCenters();loadData();
});
function loadCenters(){
  API.call('getCenters').then(function(r){
    if(!r.success)return;
    var sel=document.getElementById('center-filter');
    r.data.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
  });
}
function loadData(){
  var cid=document.getElementById('center-filter').value;
  document.getElementById('maint-list').innerHTML='<div class="loading-state">⏳ กำลังโหลด...</div>';
  API.call('getMaintenanceStatus',{centerId:cid==='ALL'?null:cid}).then(function(r){
    if(!r.success){renderItems([]);return;}
    // flatten: vehicle × maintenanceType
    allItems=[];
    (r.data||[]).forEach(function(v){
      (v.maintenance||[]).forEach(function(m){
        allItems.push(Object.assign({},m,{plateNumber:v.plateNumber,vehicleId:v.vehicleId}));
      });
    });
    allItems.sort(function(a,b){
      var p={OVERDUE:0,DUE_SOON:1,APPOINTED:2,NORMAL:3,COMPLETED:4};
      return (p[a.status]||5)-(p[b.status]||5);
    });
    renderItems(getFiltered());
  }).catch(function(){renderItems([]);});
}
function getFiltered(){
  if(currentFilter==='ALL')return allItems.filter(function(m){return m.status!=='COMPLETED';});
  return allItems.filter(function(m){return m.status===currentFilter;});
}
function filterStatus(s,btn){
  currentFilter=s;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderItems(getFiltered());
}
function renderItems(list){
  var el=document.getElementById('maint-list');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🔧</div>ไม่มีรายการ</div>';return;}
  el.innerHTML=list.map(function(m){
    var s=m.status;
    var badgeMap={OVERDUE:'badge-red',DUE_SOON:'badge-amber',APPOINTED:'badge-blue',NORMAL:'badge-green'};
    var labelMap={OVERDUE:'เกินกำหนด',DUE_SOON:'ใกล้ครบ',APPOINTED:'นัดแล้ว',NORMAL:'ปกติ'};
    var clsMap={OVERDUE:'vc-red',DUE_SOON:'vc-amber',APPOINTED:'vc-blue',NORMAL:'vc-green'};
    var due='';
    if(m.remainingDays!=null)due=(m.remainingDays<0?'🔴 เกิน '+Math.abs(m.remainingDays)+' วัน':'⏰ อีก '+m.remainingDays+' วัน');
    if(m.remainingKm!=null)due+=(due?' · ':'')+(m.remainingKm<0?'เกิน '+Math.abs(m.remainingKm)+' กม.':'เหลือ '+m.remainingKm+' กม.');
    return '<a href="vehicle.html?id='+m.vehicleId+'" class="vehicle-card '+(clsMap[s]||'vc-green')+'">'
      +'<div class="vc-stripe"></div><div class="vc-inner">'
      +'<div class="vc-top"><div><div class="vc-plate">'+m.plateNumber+'</div>'
      +'<div class="vc-sub">'+(m.typeLabel||m.type)+'</div></div>'
      +'<span class="badge '+(badgeMap[s]||'badge-green')+'">'+(labelMap[s]||s)+'</span></div>'
      +(due?'<div class="vc-meta">'+due+'</div>':'')
      +'</div></a>';
  }).join('');
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
</script>
</body>
</html>
