<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FleetSHE — บำรุงรักษา</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div class="logo-mark">🚗</div><div><div class="logo-name">FleetSHE</div><div class="logo-sub">ระบบบริหารรถยนต์</div></div></div>
  <div class="nav-group">เมนูหลัก</div>
  <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Dashboard</a>
  <a href="vehicles.html" class="nav-item"><span class="nav-icon">🚗</span>รถยนต์</a>
  <a href="maintenance.html" class="nav-item active"><span class="nav-icon">🔧</span>บำรุงรักษา</a>
  <div class="nav-group">ข้อมูล</div>
  <a href="drivers.html" class="nav-item"><span class="nav-icon">👤</span>ผู้ขับขี่</a>
  <a href="service.html" class="nav-item"><span class="nav-icon">📋</span>ประวัติซ่อม</a>
  <a href="report.html" class="nav-item"><span class="nav-icon">📊</span>รายงาน</a>
  <div class="sidebar-footer"><div class="sf-name" id="sf-name">—</div><div class="sf-role" id="sf-role">—</div><button class="logout-btn" onclick="Auth.logout()">🚪 ออกจากระบบ</button></div>
</nav>
<main class="main">
  <header class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="topbar-title">รอบบำรุงรักษา</span>
    <div class="topbar-actions"><select class="center-select" id="center-filter" onchange="loadData()"><option value="ALL">ทุกศูนย์</option></select></div>
  </header>
  <div class="page-body">
    <div class="filter-row">
      <button class="filter-btn active" onclick="filterS('ALL',this)">ทั้งหมด</button>
      <button class="filter-btn" onclick="filterS('OVERDUE',this)">🔴 เกินกำหนด</button>
      <button class="filter-btn" onclick="filterS('DUE_SOON',this)">🟡 ใกล้ครบ</button>
      <button class="filter-btn" onclick="filterS('APPOINTED',this)">🔵 นัดแล้ว</button>
      <button class="filter-btn" onclick="filterS('NORMAL',this)">🟢 ปกติ</button>
    </div>
    <div id="maint-list" class="card-list"><div class="loading-state">⏳ กำลังโหลด...</div></div>
  </div>
</main>
<nav class="bottom-nav">
  <a href="index.html" class="bnav-item"><div class="bnav-icon">🏠</div><span>หน้าหลัก</span></a>
  <a href="vehicles.html" class="bnav-item"><div class="bnav-icon">🚗</div><span>รถยนต์</span></a>
  <a href="maintenance.html" class="bnav-item active"><div class="bnav-icon">🔧</div><span>บำรุงรักษา</span></a>
  <a href="drivers.html" class="bnav-item"><div class="bnav-icon">👤</div><span>ผู้ขับขี่</span></a>
  <a href="report.html" class="bnav-item"><div class="bnav-icon">📊</div><span>รายงาน</span></a>
</nav>
</div>
<script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script>
<script>
var allItems=[];var curF='ALL';
document.addEventListener('DOMContentLoaded',function(){
  requireAuth();var u=Auth.getUser();
  if(u){document.getElementById('sf-name').textContent=u.name;document.getElementById('sf-role').textContent=roleLabel(u.role);}
  loadCenters();loadData();
});
function loadCenters(){API.call('getCenters').then(function(r){if(!r.success)return;var sel=document.getElementById('center-filter');r.data.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});});}
function loadData(){
  var cid=document.getElementById('center-filter').value;
  document.getElementById('maint-list').innerHTML='<div class="loading-state">⏳ กำลังโหลด...</div>';
  API.call('getMaintenanceStatus',{centerId:cid==='ALL'?null:cid}).then(function(r){
    allItems=[];
    (r.data||[]).forEach(function(v){(v.maintenance||[]).forEach(function(m){if(m.status!=='COMPLETED')allItems.push(Object.assign({},m,{plateNumber:v.plateNumber,vehicleId:v.vehicleId}));});});
    allItems.sort(function(a,b){var p={OVERDUE:0,DUE_SOON:1,APPOINTED:2,NORMAL:3};return(p[a.status]||5)-(p[b.status]||5);});
    renderItems(getF());
  }).catch(function(){renderItems([]);});
}
function getF(){return curF==='ALL'?allItems:allItems.filter(function(m){return m.status===curF;});}
function filterS(s,btn){curF=s;document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');renderItems(getF());}
function renderItems(list){
  var el=document.getElementById('maint-list');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🔧</div>ไม่มีรายการ</div>';return;}
  el.innerHTML=list.map(function(m){
    var s=m.status;
    var bm={OVERDUE:'badge-red',DUE_SOON:'badge-amber',APPOINTED:'badge-blue',NORMAL:'badge-green'};
    var lm={OVERDUE:'เกินกำหนด',DUE_SOON:'ใกล้ครบ',APPOINTED:'นัดแล้ว',NORMAL:'ปกติ'};
    var cm={OVERDUE:'lc-red',DUE_SOON:'lc-amber',APPOINTED:'lc-blue',NORMAL:'lc-green'};
    var due='';
    if(m.remainingDays!=null)due=(m.remainingDays<0?'🔴 เกิน '+Math.abs(m.remainingDays)+' วัน':'⏰ อีก '+m.remainingDays+' วัน');
    if(m.remainingKm!=null)due+=(due?' · ':'')+(m.remainingKm<0?'เกิน '+Math.abs(m.remainingKm)+' กม.':'เหลือ '+m.remainingKm+' กม.');
    return '<a href="vehicle.html?id='+m.vehicleId+'" class="list-card '+(cm[s]||'lc-green')+'">'
      +'<div class="lc-stripe"></div><div class="lc-body">'
      +'<div class="lc-top"><div><div class="lc-plate">'+m.plateNumber+'</div>'
      +'<div class="lc-sub">'+(m.typeLabel||m.type)+'</div></div>'
      +'<span class="badge '+(bm[s]||'badge-green')+'">'+(lm[s]||s)+'</span></div>'
      +(due?'<div class="lc-meta">'+due+'</div>':'')
      +'</div></a>';
  }).join('');
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
</script>
</body>
</html>
