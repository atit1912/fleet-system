<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FleetSHE&En — รถยนต์</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
<div class="overlay" id="ov" onclick="closeSB()"></div>
<nav class="sidebar" id="sb">
  <div class="sb-header">
    <div class="sb-logo"><div class="sb-logo-mark">🚗</div><div><div class="sb-logo-name">FleetSHE&En</div><div class="sb-logo-sub">ระบบบริหารรถยนต์</div></div></div>
    <div class="sb-user"><div class="sb-avatar" id="sb-av">—</div><div><div class="sb-uname" id="sb-nm">—</div><div class="sb-urole" id="sb-rl">—</div></div></div>
  </div>
  <div class="sb-section">เมนูหลัก</div>
  <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Dashboard</a>
  <a href="vehicles.html" class="nav-item active"><span class="nav-icon">🚗</span>รถยนต์</a>
  <a href="maintenance.html" class="nav-item"><span class="nav-icon">🔧</span>บำรุงรักษา</a>
  <div class="sb-section">ข้อมูล</div>
  <a href="drivers.html" class="nav-item"><span class="nav-icon">👤</span>ผู้ขับขี่</a>
  <a href="service.html" class="nav-item"><span class="nav-icon">📋</span>ประวัติซ่อม</a>
  <a href="report.html" class="nav-item"><span class="nav-icon">📊</span>รายงาน</a>
  <div class="sb-spacer"></div>
  <div class="sb-footer"><button class="logout-btn" onclick="Auth.logout()">🚪 ออกจากระบบ</button></div>
</nav>
<main class="main">
  <header class="topbar">
    <button class="menu-btn" onclick="openSB()">☰</button>
    <div class="topbar-center"><div class="topbar-title">รถยนต์ทั้งหมด</div></div>
    <div class="topbar-right">
      <select class="center-sel" id="cf" onchange="loadV()"><option value="ALL">ทุกศูนย์</option></select>
    </div>
  </header>
  <div class="page-body">
    <div class="filter-row">
      <button class="fpill active" onclick="fS('ALL',this)">ทั้งหมด</button>
      <button class="fpill" onclick="fS('OVERDUE',this)">🔴 เกินกำหนด</button>
      <button class="fpill" onclick="fS('DUE_SOON',this)">🟡 ใกล้ครบ</button>
      <button class="fpill" onclick="fS('APPOINTED',this)">🔵 นัดแล้ว</button>
      <button class="fpill" onclick="fS('NORMAL',this)">🟢 ปกติ</button>
    </div>
    <div id="vl"><div class="loading">⏳ กำลังโหลด...</div></div>
  </div>
</main>
<nav class="bottom-nav">
  <a href="index.html" class="bnav"><div class="bnav-wrap">🏠</div><span>หน้าหลัก</span></a>
  <a href="vehicles.html" class="bnav active"><div class="bnav-wrap">🚗</div><span>รถยนต์</span></a>
  <a href="maintenance.html" class="bnav"><div class="bnav-wrap">🔧</div><span>บำรุงรักษา</span></a>
  <a href="drivers.html" class="bnav"><div class="bnav-wrap">👤</div><span>ผู้ขับขี่</span></a>
  <a href="report.html" class="bnav"><div class="bnav-wrap">📊</div><span>รายงาน</span></a>
</nav>
</div>
<script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script>
<script>
var allV=[],curS='ALL';
var MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function tDate(s){if(!s)return'—';try{var d=new Date(s);return d.getDate()+' '+MS[d.getMonth()]+' '+(d.getFullYear()+543);}catch(e){return s;}}
document.addEventListener('DOMContentLoaded',function(){
  requireAuth();
  var u=Auth.getUser();
  if(u){var i=u.name?u.name.split(' ').map(function(w){return w[0];}).join('').substring(0,2):'AD';document.getElementById('sb-av').textContent=i;document.getElementById('sb-nm').textContent=u.name;document.getElementById('sb-rl').textContent=roleLabel(u.role);}
  API.call('getCenters').then(function(r){if(!r.success)return;var s=document.getElementById('cf');r.data.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.name;s.appendChild(o);});});
  loadV();
});
function loadV(){
  var c=document.getElementById('cf').value;
  document.getElementById('vl').innerHTML='<div class="loading">⏳ กำลังโหลด...</div>';
  API.call('getVehicles',{centerId:c==='ALL'?null:c}).then(function(r){
    allV=r.success?r.data||[]:[];renderV(getF());
  }).catch(function(){renderV([]);});
}
function getF(){return curS==='ALL'?allV:allV.filter(function(v){return v.worstStatus===curS;});}
function fS(s,b){curS=s;document.querySelectorAll('.fpill').forEach(function(x){x.classList.remove('active');});b.classList.add('active');renderV(getF());}
function renderV(list){
  var el=document.getElementById('vl');
  if(!list.length){el.innerHTML='<div class="empty"><div class="empty-icon">🚗</div>ไม่มีรถในหมวดนี้</div>';return;}
  el.innerHTML=list.map(function(v,i){
    var s=v.worstStatus||'NORMAL';
    var cm={OVERDUE:'vcard-red',DUE_SOON:'vcard-orange',APPOINTED:'vcard-blue',NORMAL:'vcard-green'};
    var bm={OVERDUE:'<span class="badge b-red">เกินกำหนด</span>',DUE_SOON:'<span class="badge b-orange">ใกล้ครบ</span>',APPOINTED:'<span class="badge b-blue">นัดแล้ว</span>',NORMAL:'<span class="badge b-green">ปกติ</span>'};
    var w=v.maintenance&&v.maintenance.find(function(m){return m.status===s;});
    return '<a href="vehicle.html?id='+v.id+'" class="vcard '+(cm[s]||'vcard-green')+' fu'+(i<4?' fu'+(i+1):'')+'">'
      +'<div class="vcard-stripe"></div><div class="vcard-body">'
      +'<div class="vcard-row"><div><div class="vcard-plate">'+v.plate_number+'</div>'
      +'<div class="vcard-model">'+v.vehicle_type+' · '+(v.center_name||'')+'</div></div>'+(bm[s]||bm.NORMAL)+'</div>'
      +'<div class="vcard-meta">🛣️ '+Number(v.current_mileage||0).toLocaleString()+' กม. · 👤 '+(v.primary_driver_name||'—')+'</div>'
      +(w&&w.typeLabel?'<div class="vcard-task">🔧 '+w.typeLabel+'</div>':'')
      +'</div></a>';
  }).join('');
}
function openSB(){document.getElementById('sb').classList.add('open');document.getElementById('ov').classList.add('show');}
function closeSB(){document.getElementById('sb').classList.remove('open');document.getElementById('ov').classList.remove('show');}
</script>
</body>
</html>
