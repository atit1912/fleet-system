<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FleetSHE — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🚗</div>
    <div><div class="logo-name">FleetSHE</div><div class="logo-sub">ระบบบริหารรถยนต์</div></div>
  </div>
  <div class="nav-group-label">เมนูหลัก</div>
  <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span>Dashboard</a>
  <a href="vehicles.html" class="nav-item"><span class="nav-icon">🚗</span>รถยนต์</a>
  <a href="maintenance.html" class="nav-item"><span class="nav-icon">🔧</span>บำรุงรักษา</a>
  <div class="nav-group-label">ข้อมูล</div>
  <a href="drivers.html" class="nav-item"><span class="nav-icon">👤</span>ผู้ขับขี่</a>
  <a href="service.html" class="nav-item"><span class="nav-icon">📋</span>ประวัติซ่อม</a>
  <a href="report.html" class="nav-item"><span class="nav-icon">📊</span>รายงาน</a>
  <div class="sidebar-footer">
    <div class="sf-name" id="sf-name">—</div>
    <div class="sf-role" id="sf-role">—</div>
  </div>
</nav>
<main class="main">
  <header class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="topbar-title">ภาพรวมระบบ</span>
    <div class="topbar-actions">
      <select class="center-select" id="center-filter" onchange="loadDashboard()">
        <option value="ALL">ทุกศูนย์</option>
      </select>
    </div>
  </header>
  <div class="page-body">
    <div class="kpi-grid">
      <div class="kpi-card kpi-blue fu"><div class="kpi-accent"></div><div class="kpi-icon-wrap">🚗</div><div class="kpi-num" id="k-total">—</div><div class="kpi-label">รถทั้งหมด</div></div>
      <div class="kpi-card kpi-red fu fu-1"><div class="kpi-accent"></div><div class="kpi-icon-wrap">⚠️</div><div class="kpi-num" id="k-over">—</div><div class="kpi-label">เกินกำหนด</div></div>
      <div class="kpi-card kpi-amber fu fu-2"><div class="kpi-accent"></div><div class="kpi-icon-wrap">⏰</div><div class="kpi-num" id="k-soon">—</div><div class="kpi-label">ใกล้ครบกำหนด</div></div>
      <div class="kpi-card kpi-green fu fu-3"><div class="kpi-accent"></div><div class="kpi-icon-wrap">✅</div><div class="kpi-num" id="k-ok">—</div><div class="kpi-label">ปกติ</div></div>
    </div>
    <div class="sec-hdr"><span class="sec-title">รายการที่ต้องดำเนินการ</span><a href="vehicles.html" class="sec-link">ดูทั้งหมด →</a></div>
    <div id="urgent-list" class="card-list"><div class="loading-state">⏳ กำลังโหลดข้อมูล...</div></div>
  </div>
</main>
<nav class="bottom-nav">
  <a href="index.html" class="bnav-item active"><div class="bnav-icon-wrap">🏠</div><span>หน้าหลัก</span></a>
  <a href="vehicles.html" class="bnav-item"><div class="bnav-icon-wrap">🚗</div><span>รถยนต์</span></a>
  <a href="maintenance.html" class="bnav-item"><div class="bnav-icon-wrap">🔧</div><span>บำรุงรักษา</span></a>
  <a href="drivers.html" class="bnav-item"><div class="bnav-icon-wrap">👤</div><span>ผู้ขับขี่</span></a>
  <a href="report.html" class="bnav-item"><div class="bnav-icon-wrap">📊</div><span>รายงาน</span></a>
</nav>
</div>
<script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  requireAuth();
  var u=Auth.getUser();
  if(u){document.getElementById('sf-name').textContent=u.name;document.getElementById('sf-role').textContent=roleLabel(u.role);}
  loadCenters();loadDashboard();
});
function loadCenters(){
  API.call('getCenters').then(function(r){
    if(!r.success)return;
    var sel=document.getElementById('center-filter');
    r.data.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
  });
}
function loadDashboard(){
  var cid=document.getElementById('center-filter').value;
  document.getElementById('urgent-list').innerHTML='<div class="loading-state">⏳ กำลังโหลดข้อมูล...</div>';
  API.call('getDashboard',{centerId:cid}).then(function(r){
    if(!r.success){renderNoData();return;}
    var s=r.summary;
    document.getElementById('k-total').textContent=s.total||0;
    document.getElementById('k-over').textContent=s.overdue||0;
    document.getElementById('k-soon').textContent=s.dueSoon||0;
    document.getElementById('k-ok').textContent=(s.normal||0)+(s.appointed>0?' (+'+s.appointed+' นัด)':'');
    renderUrgent(r.urgentList||[]);
  }).catch(renderNoData);
}
function renderUrgent(list){
  var el=document.getElementById('urgent-list');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">✅</div>ไม่มีรายการที่ต้องดำเนินการ</div>';return;}
  el.innerHTML=list.map(function(v){
    var over=v.status==='OVERDUE';
    var cls=over?'vc-red':'vc-amber';
    var badge=over?'<span class="badge badge-red">🔴 เกินกำหนด</span>':'<span class="badge badge-amber">🟡 ใกล้ครบกำหนด</span>';
    var meta=[];
    if(v.remainingKm!=null)meta.push((v.remainingKm<0?'เกิน '+Math.abs(v.remainingKm)+' กม.':'เหลือ '+v.remainingKm+' กม.'));
    if(v.remainingDays!=null)meta.push((v.remainingDays<0?'เกิน '+Math.abs(v.remainingDays)+' วัน':'อีก '+v.remainingDays+' วัน'));
    return '<a href="vehicle.html?id='+v.vehicleId+'" class="vehicle-card '+cls+'">'
      +'<div class="vc-stripe"></div><div class="vc-inner">'
      +'<div class="vc-top"><div><div class="vc-plate">'+v.plateNumber+'</div>'
      +'<div class="vc-sub">'+v.brand+' '+v.model+(v.centerName?' · '+v.centerName:'')+'</div></div>'+badge+'</div>'
      +'<div class="vc-meta">'+meta.join(' · ')+'</div>'
      +'<div class="vc-task">🔧 '+(v.typeLabel||'')+'</div>'
      +'</div></a>';
  }).join('');
}
function renderNoData(){document.getElementById('urgent-list').innerHTML='<div class="empty-state"><div class="empty-icon">🚗</div>ยังไม่มีข้อมูลรถ<br><small>กรุณากรอกข้อมูลใน Google Sheet</small></div>';}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
</script>
</body>
</html>
