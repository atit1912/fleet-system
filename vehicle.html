<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Intelligent Fleet SHE&amp;En — รายละเอียดรถ</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<style>
/* ── Timeline ── */
.timeline{padding:4px 0;}
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:20px;}
.tl-item:last-child{padding-bottom:0;}
.tl-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:36px;}
.tl-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;z-index:1;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(11,94,215,.2);}
[data-theme="dark"] .tl-dot{border-color:var(--surface);}
.tl-line{width:2px;flex:1;background:var(--border);margin-top:4px;}
.tl-item:last-child .tl-line{display:none;}
.tl-content{flex:1;padding-top:6px;padding-bottom:4px;}
.tl-date{font-size:11px;color:var(--t3);margin-bottom:3px;}
.tl-title{font-size:14px;font-weight:600;color:var(--t1);}
.tl-meta{font-size:12px;color:var(--t3);margin-top:3px;}
.tl-tasks{font-size:12px;color:var(--t2);margin-top:6px;background:var(--bg);border-radius:var(--r8);padding:8px 10px;line-height:1.6;}
.tl-note{font-size:11px;color:var(--t3);margin-top:4px;font-style:italic;}

/* ── Mileage chart ── */
.mile-wrap{background:var(--surface);border-radius:var(--r16);border:1px solid var(--border);box-shadow:var(--sh1);padding:14px;margin-bottom:12px;}
.mile-title{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:10px;}
.mile-bars{display:flex;flex-direction:column;gap:6px;}
.mile-bar-row{display:flex;align-items:center;gap:8px;}
.mile-bar-label{font-size:11px;color:var(--t3);width:70px;flex-shrink:0;text-align:right;}
.mile-bar-track{flex:1;height:20px;background:var(--bg);border-radius:var(--r8);overflow:hidden;position:relative;}
.mile-bar-fill{height:100%;border-radius:var(--r8);background:linear-gradient(90deg,var(--p600),var(--p400));transition:width .5s;}
.mile-bar-val{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--t2);font-weight:500;}

/* ── appt box ── */
.appt-box{background:var(--p50);border:1.5px solid var(--p200);border-radius:var(--r12);padding:12px;margin-top:10px;}
[data-theme="dark"] .appt-box{background:var(--p100);border-color:var(--p200);}
.appt-lbl{font-size:12px;font-weight:600;color:var(--p600);margin-bottom:8px;}
[data-theme="dark"] .appt-lbl{color:#4A8AE8;}
</style>
</head>
<body>
<div id="app">
<main class="main" style="margin-left:0">
  <div class="det-hdr">
    <button class="back-btn" onclick="history.back()">←</button>
    <div style="flex:1"><div class="det-plate" id="dp">—</div><div class="det-model" id="dm">—</div></div>
    <span id="db"></span>
    <button class="theme-toggle" onclick="Theme.toggle()" style="flex-shrink:0">🌙</button>
    <button onclick="Auth.logout()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;margin-left:6px;">🚪</button>
  </div>
  <div class="tabbar">
    <div class="tab active" onclick="showT('info',this)">ข้อมูลรถ</div>
    <div class="tab" onclick="showT('maint',this)">รอบบำรุง</div>
    <div class="tab" onclick="showT('hist',this)">ประวัติ</div>
    <div class="tab" onclick="showT('mile',this)">อัปเดตไมล์</div>
  </div>
  <div class="page-body">

    <!-- TAB: ข้อมูลรถ -->
    <div id="tab-info">
      <div id="ic" class="icard"><div class="loading">⏳ กำลังโหลด...</div></div>
    </div>

    <!-- TAB: รอบบำรุง -->
    <div id="tab-maint" style="display:none"><div id="ml"></div></div>

    <!-- TAB: ประวัติ (Timeline) -->
    <div id="tab-hist" style="display:none">
      <div id="mile-chart"></div>
      <div class="icard">
        <div class="icard-hdr" style="display:flex;align-items:center;justify-content:space-between">
          <span>📋 ประวัติการเข้ารับบริการ</span>
          <button class="btn btn-primary btn-sm write-only" onclick="openAddRecord()" style="font-size:12px">➕ เพิ่มประวัติ</button>
        </div>
        <div style="padding:16px"><div id="tl-wrap" class="timeline"></div></div>
      </div>
    </div>

    <!-- Modal: เพิ่ม/แก้ไข service record -->
    <div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:16px">
      <div style="background:var(--surface);border-radius:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.4)">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <div style="font-size:16px;font-weight:700;color:var(--t1)" id="modal-title">➕ เพิ่มประวัติการเข้ารับบริการ</div>
          <button onclick="closeModal()" style="background:none;border:none;color:var(--t3);font-size:22px;cursor:pointer;line-height:1">×</button>
        </div>
        <div style="padding:16px 20px">
          <input type="hidden" id="modal-record-id">

          <div class="fgroup">
            <label class="flabel">ประเภทการบำรุงรักษา</label>
            <select id="modal-type" class="fselect" onchange="updateModalTasks()">
              <option value="INITIAL_1000KM">ตรวจเช็กระยะ 1,000 กม.แรก</option>
              <option value="ROUTINE_10K">ตรวจเช็กตามระยะ (10,000/6 เดือน)</option>
              <option value="TIRE_ROTATION">สลับยาง</option>
              <option value="TIRE_REPLACEMENT">เปลี่ยนยาง</option>
              <option value="BATTERY_REPLACEMENT">เปลี่ยนแบตเตอรี่</option>
            </select>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="fgroup">
              <label class="flabel">วันที่เข้ารับบริการ</label>
              <input type="date" id="modal-date" class="finput">
            </div>
            <div class="fgroup">
              <label class="flabel">เลขไมล์ตอนเข้า (กม.)</label>
              <input type="number" id="modal-km" class="finput" placeholder="เช่น 10250">
            </div>
          </div>

          <div class="fgroup">
            <label class="flabel">รายการที่ทำ</label>
            <div id="modal-checklist" style="background:var(--bg);border-radius:8px;padding:6px 12px;margin-bottom:8px;border:1px solid var(--border)"></div>
            <input type="text" id="modal-tasks-extra" class="finput" placeholder="พิมพ์เพิ่มเติม (ไม่บังคับ)">
          </div>

          <div class="fgroup">
            <label class="flabel">หมายเหตุ</label>
            <input type="text" id="modal-notes" class="finput" placeholder="ไม่บังคับ">
          </div>

          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn btn-primary btn-full" onclick="saveModalRecord()">💾 บันทึก</button>
            <button class="btn btn-secondary" onclick="closeModal()" style="flex-shrink:0">ยกเลิก</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB: อัปเดตไมล์ -->
    <div id="tab-mile" style="display:none">
      <div class="card">
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:13px;color:var(--t3);margin-bottom:4px">เลขไมล์ปัจจุบัน</div>
          <div id="cm" style="font-size:40px;font-weight:700;color:var(--p600)">—</div>
          <div style="font-size:12px;color:var(--t4)">กิโลเมตร</div>
        </div>
        <div class="fgroup"><label class="flabel">เลขไมล์ใหม่ (กม.)</label>
          <input type="number" id="nm" class="finput" placeholder="กรอกเลขไมล์" style="font-size:22px;font-weight:700;text-align:center">
        </div>
        <div class="fgroup"><label class="flabel">วันที่อัปเดต</label><input type="date" id="md" class="finput"></div>
        <div class="fgroup"><label class="flabel">หมายเหตุ</label><input type="text" id="mn" class="finput" placeholder="เช่น กลับจากภาคสนาม"></div>
        <button class="btn btn-primary btn-full btn-lg" onclick="saveMile()">💾 บันทึกเลขไมล์</button>
      </div>
    </div>

  </div>
</main>
</div>
<script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script>
<script>
var VID='', VD=null;
var MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function tDate(s){if(!s)return'—';try{var d=new Date(s);return d.getDate()+' '+MS[d.getMonth()]+' '+(d.getFullYear()+543);}catch(e){return s;}}
var ML={
  INITIAL_1000KM:'ตรวจเช็กระยะ 1,000 กม.แรก',
  ROUTINE_10K:'ตรวจเช็กตามระยะ (10,000/6 เดือน)',
  TIRE_ROTATION:'สลับยาง',
  TIRE_REPLACEMENT:'เปลี่ยนยาง',
  BATTERY_REPLACEMENT:'เปลี่ยนแบตเตอรี่'
};
var ML_ICON={INITIAL_1000KM:'🔑',ROUTINE_10K:'🔧',TIRE_ROTATION:'🔄',TIRE_REPLACEMENT:'🛞',BATTERY_REPLACEMENT:'🔋'};
var ML_COLOR={INITIAL_1000KM:'var(--p600)',ROUTINE_10K:'var(--success)',TIRE_ROTATION:'var(--warning)',TIRE_REPLACEMENT:'var(--danger)',BATTERY_REPLACEMENT:'#8B5CF6'};
var ML_BG={INITIAL_1000KM:'var(--p100)',ROUTINE_10K:'var(--success-bg)',TIRE_ROTATION:'var(--warning-bg)',TIRE_REPLACEMENT:'var(--danger-bg)',BATTERY_REPLACEMENT:'#F3E8FF'};

document.addEventListener('DOMContentLoaded',function(){
  requireAuth();
  VID=new URLSearchParams(location.search).get('id')||'';
  document.getElementById('md').value=new Date().toISOString().split('T')[0];
  if(VID)loadV();
});

function loadV(){
  API.call('getVehicle',{id:VID}).then(function(r){
    if(!r.success)return;
    VD=r.data; var v=r.data;
    document.getElementById('dp').textContent=v.plate_number;
    document.getElementById('dm').textContent=v.vehicle_type+' · '+(v.center_name||'');
    var s=v.worstStatus||'NORMAL';
    var bm={OVERDUE:'b-red',DUE_SOON:'b-orange',APPOINTED:'b-blue',NORMAL:'b-green'};
    var lm={OVERDUE:'เกินกำหนด',DUE_SOON:'ใกล้ครบกำหนด',APPOINTED:'นัดแล้ว',NORMAL:'ปกติ'};
    document.getElementById('db').innerHTML='<span class="badge '+(bm[s]||'b-green')+'">'+(lm[s]||s)+'</span>';
    document.getElementById('ic').innerHTML=
      '<div class="icard-hdr">🚗 ข้อมูลรถ</div>'
      +irow('📋','ทะเบียน',v.plate_number)
      +irow('🚙','ประเภท',v.vehicle_type+' · '+v.brand+' '+v.model)
      +irow('🎨','สี',v.color||'—')
      +irow('🏢','ศูนย์วิจัย',v.center_name||'—')
      +irow('👤','ผู้ครอบครอง',v.primary_driver_name||'—')
      +irow('📅','วันที่รับรถ',tDate(v.delivered_at))
      +irow('📅','หมดสัญญาเช่า',tDate(v.lease_expires_at))
      +irow('🛣️','เลขไมล์ล่าสุด',Number(v.current_mileage||0).toLocaleString()+' กม.')
      +irow('🗓️','อัปเดตไมล์เมื่อ',tDate(v.mileage_updated_at));
    document.getElementById('cm').textContent=Number(v.current_mileage||0).toLocaleString();
    document.getElementById('nm').value=v.current_mileage||'';
    renderMaint(v.maintenance||[]);
    renderTimeline(v.serviceRecords||[], v);
  });
}

function irow(ic,lb,vl){
  return '<div class="irow"><div class="irow-icon">'+ic+'</div>'
    +'<div><div class="irow-label">'+lb+'</div><div class="irow-val">'+vl+'</div></div></div>';
}

function renderTimeline(records, vehicle){
  var chartEl=document.getElementById('mile-chart');
  var tlEl=document.getElementById('tl-wrap');
  if(!records.length){
    tlEl.innerHTML='<div class="empty"><div class="empty-icon">📋</div>ยังไม่มีประวัติการเข้ารับบริการ</div>';
    chartEl.innerHTML='';return;
  }
  records.sort(function(a,b){return new Date(b.serviced_at)-new Date(a.serviced_at);});
  var curKm=parseInt(vehicle.current_mileage)||0;
  var milestones=[{label:'1,000 กม.',km:1000},{label:'10,000 กม.',km:10000},{label:'20,000 กม.',km:20000},{label:'30,000 กม.',km:30000},{label:'50,000 กม.',km:50000}]
    .filter(function(m){return m.km<=Math.max(curKm*1.2,10000);});
  chartEl.innerHTML='<div class="mile-wrap"><div class="mile-title">📊 ระยะทางสะสม — '+Number(curKm).toLocaleString()+' กม.</div>'
    +'<div class="mile-bars">'
    +milestones.map(function(m){
      var pct=Math.min(100,Math.round(curKm/m.km*100));
      return '<div class="mile-bar-row"><div class="mile-bar-label">'+m.label+'</div>'
        +'<div class="mile-bar-track"><div class="mile-bar-fill" style="width:'+pct+'%"></div>'
        +'<span class="mile-bar-val">'+pct+'%</span></div></div>';
    }).join('')+'</div></div>';
  tlEl.innerHTML=records.map(function(r){
    var type=r.maintenance_type||'ROUTINE_10K';
    var icon=ML_ICON[type]||'🔧';
    var color=ML_COLOR[type]||'var(--p600)';
    var bg=ML_BG[type]||'var(--p100)';
    var title=ML[type]||r.maintenance_type||'ไม่ระบุ';
    var dateStr = r.serviced_at ? r.serviced_at.split('T')[0] : '';
    var tasksEsc = String(r.tasks||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    var notesEsc = String(r.notes||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    var canWrite = typeof Auth!=='undefined' && Auth.canWrite ? Auth.canWrite() : true;
    return '<div class="tl-item">'
      +'<div class="tl-left"><div class="tl-dot" style="background:'+bg+';color:'+color+'">'+icon+'</div><div class="tl-line"></div></div>'
      +'<div class="tl-content">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">'
      +'<div class="tl-date">'+tDate(r.serviced_at)+'</div>'
      +(canWrite?'<button onclick="openEditRecord(\''+r.id+'\',\''+type+'\',\''+dateStr+'\','+Number(r.mileage_at_service||0)+',\''+tasksEsc+'\',\''+notesEsc+'\')" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--t3);font-size:10px;padding:2px 7px;cursor:pointer;flex-shrink:0">✏️ แก้</button>':'')
      +'</div>'
      +'<div class="tl-title">'+title+'</div>'
      +'<div class="tl-meta">🛣️ '+Number(r.mileage_at_service||0).toLocaleString()+' กม.</div>'
      +(r.tasks?'<div class="tl-tasks">'+r.tasks+'</div>':'')
      +(r.notes?'<div class="tl-note">💬 '+r.notes+'</div>':'')
      +'</div></div>';
  }).join('');
}

function renderMaint(list){
  var el=document.getElementById('ml');
  if(!list.length){el.innerHTML='<div class="empty">ไม่มีข้อมูล</div>';return;}
  var order={OVERDUE:0,DUE_SOON:1,APPOINTED:2,NORMAL:3,COMPLETED:4};
  list.sort(function(a,b){return(order[a.status]||5)-(order[b.status]||5);});

  // รายการที่ทำ pre-defined ตามประเภท
  var TASKS_PRESET = {
    INITIAL_1000KM:      ['ตรวจเช็กระยะ 1,000 กม.แรก','เปลี่ยนน้ำมันเครื่อง','ตรวจสอบระดับน้ำมันเบรก','ตรวจสอบยางรถยนต์','ตรวจสอบแบตเตอรี่'],
    ROUTINE_10K:         ['ตรวจเช็กตามระยะ 10,000 กม.','เปลี่ยนน้ำมันเครื่อง','เปลี่ยนไส้กรองน้ำมันเครื่อง','ตรวจเช็ก 20 รายการ','ตรวจสอบระบบเบรก','ตรวจสอบระบบไฟ'],
    TIRE_ROTATION:       ['สลับยาง 4 เส้น','ตรวจสอบแรงดันลมยาง','ตรวจสอบดอกยาง','ตรวจสอบน็อตล้อ'],
    TIRE_REPLACEMENT:    ['เปลี่ยนยาง 4 เส้น','ตรวจสอบแรงดันลมยาง','ตั้งศูนย์ล้อ','ถ่วงล้อ'],
    BATTERY_REPLACEMENT: ['เปลี่ยนแบตเตอรี่','ตรวจสอบขั้วแบตเตอรี่','ทดสอบกระแสไฟ']
  };

  el.innerHTML=list.filter(function(m){return m.status!=='COMPLETED';}).map(function(m){
    var s=m.status;
    var co={OVERDUE:'var(--danger)',DUE_SOON:'var(--warning)',APPOINTED:'var(--p600)',NORMAL:'var(--success)'};
    var bg2={OVERDUE:'var(--danger-bg)',DUE_SOON:'var(--warning-bg)',APPOINTED:'var(--p100)',NORMAL:'var(--success-bg)'};
    var bm={OVERDUE:'b-red',DUE_SOON:'b-orange',APPOINTED:'b-blue',NORMAL:'b-green'};
    var sl={OVERDUE:'เกินกำหนด',DUE_SOON:'ใกล้ครบ',APPOINTED:'นัดแล้ว',NORMAL:'ปกติ'};
    var km=VD?parseInt(VD.current_mileage)||0:0;
    var pct=m.dueMileage?Math.min(100,Math.round(km/m.dueMileage*100)):0;
    var pc=pct>=100?'pf-red':pct>=85?'pf-orange':'pf-blue';
    var canWrite = typeof Auth !== 'undefined' && Auth.canWrite ? Auth.canWrite() : true;

    // สร้าง checklist รายการ
    var presets = TASKS_PRESET[m.type] || [];
    var checklistHtml = presets.map(function(task,i){
      return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light);cursor:pointer;font-size:13px;color:var(--t1)">'
        +'<input type="checkbox" id="sr-chk-'+m.type+'-'+i+'" value="'+task+'" '+(i===0?'checked':'')+' onchange="updateTasksField(\''+m.type+'\')" style="width:16px;height:16px;cursor:pointer;accent-color:var(--p600)">'
        +task+'</label>';
    }).join('');

    return '<div class="mcard mcard-'+(s==='OVERDUE'?'red':s==='DUE_SOON'?'orange':s==='APPOINTED'?'blue':'green')+'">'
      +'<div class="mcard-stripe"></div>'
      +'<div class="mcard-head">'
      +'<div class="mcard-icon" style="background:'+bg2[s]+';color:'+co[s]+'">🔧</div>'
      +'<div style="flex:1"><div class="mcard-title">'+(m.typeLabel||ML[m.type]||m.type)+'</div>'
      +(m.remainingDays!=null?'<div class="mcard-sub">'+(m.remainingDays<0?'เกิน '+Math.abs(m.remainingDays)+' วัน':'อีก '+m.remainingDays+' วัน')+'</div>':'')
      +'</div><span class="badge '+(bm[s]||'b-green')+'">'+(sl[s]||s)+'</span></div>'
      +'<div class="mcard-body">'
      +(m.dueMileage?'<div class="dual-prog">'
        +'<div><div class="dp-lbl">ระยะทาง</div>'
        +'<div class="prog-track"><div class="prog-fill '+pc+'" style="width:'+pct+'%"></div></div>'
        +'<div style="font-size:10px;color:var(--t3);margin-top:3px">'+Number(km).toLocaleString()+' / '+Number(m.dueMileage).toLocaleString()+' กม.</div></div>'
        +(m.dueDate?'<div><div class="dp-lbl">ครบกำหนด</div><div style="font-size:13px;font-weight:600;margin-top:6px;color:'+co[s]+'">'+tDate(m.dueDate)+'</div></div>':'')
        +'</div>':'')
      // ── บันทึก service record ──
      +(canWrite?'<div class="appt-box" style="margin-top:10px">'
        +'<div class="appt-lbl">✅ บันทึกเข้ารับบริการ</div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'
        +'<div><div style="font-size:11px;color:var(--t3);margin-bottom:4px">วันที่เข้ารับบริการ</div>'
        +'<input type="date" id="sr-date-'+m.type+'" class="finput" style="font-size:13px"></div>'
        +'<div><div style="font-size:11px;color:var(--t3);margin-bottom:4px">เลขไมล์ (กม.)</div>'
        +'<input type="number" id="sr-km-'+m.type+'" class="finput" style="font-size:13px" placeholder="กรอกเลขไมล์" value="'+(VD?VD.current_mileage:'')+'"></div>'
        +'</div>'
        // checklist
        +(presets.length?'<div style="margin-bottom:10px">'
          +'<div style="font-size:11px;color:var(--t3);margin-bottom:6px">รายการที่ทำ (เลือกได้หลายรายการ)</div>'
          +'<div style="background:var(--bg);border-radius:8px;padding:4px 10px">'+checklistHtml+'</div>'
          +'<div style="margin-top:6px"><input type="text" id="sr-tasks-'+m.type+'" class="finput" style="font-size:12px" placeholder="หรือพิมพ์เพิ่มเติม..."></div>'
          +'</div>':'')
        +'<div style="margin-bottom:10px"><div style="font-size:11px;color:var(--t3);margin-bottom:4px">หมายเหตุ</div>'
        +'<input type="text" id="sr-note-'+m.type+'" class="finput" style="font-size:13px" placeholder="ไม่บังคับ"></div>'
        +'<div style="display:flex;gap:8px">'
        +'<button class="btn btn-primary btn-sm" style="flex:1" onclick="saveServiceRecord(\''+m.type+'\',true)">💾 บันทึก + ปิดนัด</button>'
        +'<button class="btn btn-secondary btn-sm" onclick="saveServiceRecord(\''+m.type+'\',false)">บันทึก</button>'
        +'</div></div>':'')
      // นัดหมาย
      +(canWrite && s!=='APPOINTED'?'<div class="appt-box"><div class="appt-lbl">📅 ตั้งวันนัดหมาย</div>'
        +'<div style="display:flex;gap:8px;align-items:center">'
        +'<input type="date" id="a-'+m.type+'" class="finput" style="flex:1">'
        +'<button class="btn btn-primary btn-sm" onclick="setA(\''+m.type+'\')">บันทึก</button>'
        +'</div></div>':'')
      +'</div></div>';
  }).join('');

  // ตั้งค่า default วันนี้ + sync tasks field จาก checklist
  list.forEach(function(m){
    var dateEl = document.getElementById('sr-date-'+m.type);
    if(dateEl && !dateEl.value) dateEl.value = new Date().toISOString().split('T')[0];
    updateTasksField(m.type);
  });
}

// sync checklist → tasks field
function updateTasksField(type){
  var checked = [];
  document.querySelectorAll('[id^="sr-chk-'+type+'-"]').forEach(function(chk){
    if(chk.checked) checked.push(chk.value);
  });
  var extraEl = document.getElementById('sr-tasks-'+type);
  if(extraEl && !extraEl._userTyped) extraEl.placeholder = checked.length ? checked.join(', ') : 'หรือพิมพ์เพิ่มเติม...';
}

// เมื่อ user พิมพ์เองใน tasks field ให้ mark ว่า user typed
document.addEventListener('input', function(e){
  if(e.target && e.target.id && e.target.id.startsWith('sr-tasks-')){
    e.target._userTyped = e.target.value.length > 0;
  }
});

function saveServiceRecord(type, closeAppt){
  var dateEl  = document.getElementById('sr-date-'+type);
  var kmEl    = document.getElementById('sr-km-'+type);
  var tasksEl = document.getElementById('sr-tasks-'+type);
  var noteEl  = document.getElementById('sr-note-'+type);

  var servicedAt = dateEl ? dateEl.value : '';
  var km         = kmEl   ? parseInt(kmEl.value) || 0 : 0;
  var note       = noteEl  ? noteEl.value.trim() : '';

  // รวม checklist + typed text เป็น tasks
  var checked = [];
  document.querySelectorAll('[id^="sr-chk-'+type+'-"]').forEach(function(chk){
    if(chk.checked) checked.push(chk.value);
  });
  var extra  = tasksEl && tasksEl._userTyped ? tasksEl.value.trim() : '';
  var tasks  = checked.concat(extra ? [extra] : []).join(', ');

  if(!servicedAt){ alert('กรุณาเลือกวันที่เข้ารับบริการ'); return; }
  if(!km){ alert('กรุณากรอกเลขไมล์'); return; }

  API.post('addServiceRecord', {
    vehicleId:         VID,
    maintenanceType:   type,
    servicedAt:        servicedAt,
    mileageAtService:  km,
    tasks:             tasks,
    notes:             note,
    appointmentClosed: closeAppt ? 'true' : 'false'
  }).then(function(r){
    if(r.success){
      localStorage.setItem('fleet-data-updated', Date.now());
      alert('บันทึกเรียบร้อย ✅');
      loadV();
    } else {
      alert('เกิดข้อผิดพลาด: '+(r.error||''));
    }
  });
}

function setA(t){
  var d=document.getElementById('a-'+t).value;
  if(!d){alert('กรุณาเลือกวันที่');return;}
  API.post('setAppointment',{vehicleId:VID,maintenanceType:t,appointmentDate:d})
    .then(function(r){if(r.success){alert('บันทึกนัดหมายเรียบร้อย ✅');loadV();}});
}

function saveMile(){
  var m=parseInt(document.getElementById('nm').value);
  var d=document.getElementById('md').value;
  var n=document.getElementById('mn').value;
  if(!m||m<0){alert('กรุณากรอกเลขไมล์');return;}
  API.post('updateMileage',{vehicleId:VID,mileage:m,recordedAt:d,note:n})
    .then(function(r){
      if(r.success){
        localStorage.setItem('fleet-data-updated', Date.now());
        alert('บันทึกสำเร็จ ✅');
        loadV();
      }
    });
}

function showT(id,el){
  ['info','maint','hist','mile'].forEach(function(t){
    document.getElementById('tab-'+t).style.display=t===id?'block':'none';
  });
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
}

/* ══ Modal: เพิ่ม/แก้ไข service record ══ */
var MODAL_TASKS = {
  INITIAL_1000KM:      ['ตรวจเช็กระยะ 1,000 กม.แรก','เปลี่ยนน้ำมันเครื่อง','ตรวจสอบระดับน้ำมันเบรก','ตรวจสอบยางรถยนต์','ตรวจสอบแบตเตอรี่'],
  ROUTINE_10K:         ['ตรวจเช็กตามระยะ 10,000 กม.','เปลี่ยนน้ำมันเครื่อง','เปลี่ยนไส้กรองน้ำมันเครื่อง','ตรวจเช็ก 20 รายการ','ตรวจสอบระบบเบรก','ตรวจสอบระบบไฟ'],
  TIRE_ROTATION:       ['สลับยาง 4 เส้น','ตรวจสอบแรงดันลมยาง','ตรวจสอบดอกยาง','ตรวจสอบน็อตล้อ'],
  TIRE_REPLACEMENT:    ['เปลี่ยนยาง 4 เส้น','ตรวจสอบแรงดันลมยาง','ตั้งศูนย์ล้อ','ถ่วงล้อ'],
  BATTERY_REPLACEMENT: ['เปลี่ยนแบตเตอรี่','ตรวจสอบขั้วแบตเตอรี่','ทดสอบกระแสไฟ']
};

function openAddRecord(){
  document.getElementById('modal-record-id').value = '';
  document.getElementById('modal-title').textContent = '➕ เพิ่มประวัติการเข้ารับบริการ';
  document.getElementById('modal-type').value = 'ROUTINE_10K';
  document.getElementById('modal-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('modal-km').value = VD ? VD.current_mileage : '';
  document.getElementById('modal-tasks-extra').value = '';
  document.getElementById('modal-notes').value = '';
  updateModalTasks();
  var ov = document.getElementById('modal-overlay');
  ov.style.display = 'flex';
}

function openEditRecord(recordId, type, date, km, tasks, notes){
  document.getElementById('modal-record-id').value = recordId;
  document.getElementById('modal-title').textContent = '✏️ แก้ไขประวัติการเข้ารับบริการ';
  document.getElementById('modal-type').value = type;
  document.getElementById('modal-date').value = date;
  document.getElementById('modal-km').value = km;
  document.getElementById('modal-tasks-extra').value = tasks || '';
  document.getElementById('modal-notes').value = notes || '';
  updateModalTasks(tasks);
  var ov = document.getElementById('modal-overlay');
  ov.style.display = 'flex';
}

function closeModal(){
  document.getElementById('modal-overlay').style.display = 'none';
}

function updateModalTasks(existingTasks){
  var type = document.getElementById('modal-type').value;
  var presets = MODAL_TASKS[type] || [];
  var existing = existingTasks ? existingTasks.split(',').map(function(t){return t.trim();}) : [];
  var html = presets.map(function(task, i){
    var checked = existing.length ? existing.indexOf(task) > -1 : i === 0;
    return '<label style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border-light);cursor:pointer;font-size:13px;color:var(--t1)">'
      +'<input type="checkbox" value="'+task+'"'+(checked?' checked':'')+' style="width:16px;height:16px;cursor:pointer;accent-color:var(--p600)">'
      +task+'</label>';
  }).join('');
  document.getElementById('modal-checklist').innerHTML = html;
}

function saveModalRecord(){
  var recordId  = document.getElementById('modal-record-id').value;
  var type      = document.getElementById('modal-type').value;
  var date      = document.getElementById('modal-date').value;
  var km        = parseInt(document.getElementById('modal-km').value) || 0;
  var extra     = document.getElementById('modal-tasks-extra').value.trim();
  var notes     = document.getElementById('modal-notes').value.trim();

  if(!date){ alert('กรุณาเลือกวันที่'); return; }
  if(!km){ alert('กรุณากรอกเลขไมล์'); return; }

  // รวม checklist
  var checked = [];
  document.querySelectorAll('#modal-checklist input[type=checkbox]').forEach(function(chk){
    if(chk.checked) checked.push(chk.value);
  });
  var tasks = checked.concat(extra ? [extra] : []).join(', ');

  if(recordId){
    // แก้ไข record เดิม
    API.post('updateServiceRecord',{
      recordId: recordId, vehicleId: VID,
      maintenanceType: type, servicedAt: date,
      mileageAtService: km, tasks: tasks, notes: notes
    }).then(function(r){
      if(r.success){
        localStorage.setItem('fleet-data-updated', Date.now());
        closeModal(); loadV();
      } else { alert('เกิดข้อผิดพลาด: '+(r.error||'')); }
    });
  } else {
    // เพิ่ม record ใหม่
    API.post('addServiceRecord',{
      vehicleId: VID, maintenanceType: type,
      servicedAt: date, mileageAtService: km,
      tasks: tasks, notes: notes, appointmentClosed: 'false'
    }).then(function(r){
      if(r.success){
        localStorage.setItem('fleet-data-updated', Date.now());
        closeModal(); loadV();
      } else { alert('เกิดข้อผิดพลาด: '+(r.error||'')); }
    });
  }
}

// ปิด modal เมื่อกด overlay
document.getElementById('modal-overlay').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});
</script>
