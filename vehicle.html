<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FleetSHE&En — รายละเอียดรถ</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
<main class="main" style="margin-left:0">
  <div class="det-hdr">
    <button class="back-btn" onclick="history.back()">←</button>
    <div style="flex:1"><div class="det-plate" id="dp">—</div><div class="det-model" id="dm">—</div></div>
    <span id="db"></span>
    <button class="logout-btn" onclick="Auth.logout()" style="width:auto;padding:6px 12px;margin-left:6px;font-size:12px;border-radius:8px">🚪</button>
  </div>
  <div class="tabbar">
    <div class="tab active" onclick="showT('info',this)">ข้อมูลรถ</div>
    <div class="tab" onclick="showT('maint',this)">รอบบำรุง</div>
    <div class="tab" onclick="showT('hist',this)">ประวัติซ่อม</div>
    <div class="tab" onclick="showT('mile',this)">อัปเดตไมล์</div>
  </div>
  <div class="page-body">
    <div id="tab-info"><div id="ic" class="icard"><div class="loading">⏳ กำลังโหลด...</div></div></div>
    <div id="tab-maint" style="display:none"><div id="ml"></div></div>
    <div id="tab-hist" style="display:none"><div id="hl"></div></div>
    <div id="tab-mile" style="display:none">
      <div class="card">
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:13px;color:var(--t3);margin-bottom:4px">เลขไมล์ปัจจุบัน</div>
          <div id="cm" style="font-size:40px;font-weight:700;color:var(--p600)">—</div>
          <div style="font-size:12px;color:var(--t4)">กิโลเมตร</div>
        </div>
        <div class="fgroup"><label class="flabel">เลขไมล์ใหม่ (กม.)</label><input type="number" id="nm" class="finput" placeholder="กรอกเลขไมล์" style="font-size:22px;font-weight:700;text-align:center"></div>
        <div class="fgroup"><label class="flabel">วันที่อัปเดต</label><input type="date" id="md" class="finput"></div>
        <div class="fgroup"><label class="flabel">หมายเหตุ</label><input type="text" id="mn" class="finput" placeholder="เช่น กลับจากภาคสนาม"></div>
        <button class="btn btn-primary btn-full btn-lg" onclick="saveMile()">💾 บันทึกเลขไมล์</button>
      </div>
    </div>
  </div>
</main>
</div>
<script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script>
<script>
var VID='',VD=null;
var MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function tDate(s){if(!s)return'—';try{var d=new Date(s);return d.getDate()+' '+MS[d.getMonth()]+' '+(d.getFullYear()+543);}catch(e){return s;}}
var ML={INITIAL_1000KM:'ตรวจเช็กระยะ 1,000 กม.แรก',ROUTINE_10K:'เช็กระยะ 10,000 กม./6 เดือน',TIRE_ROTATION:'สลับยาง',TIRE_REPLACEMENT:'เปลี่ยนยาง',BATTERY_REPLACEMENT:'เปลี่ยนแบตเตอรี่'};

document.addEventListener('DOMContentLoaded',function(){
  requireAuth();
  VID=new URLSearchParams(location.search).get('id')||'';
  document.getElementById('md').value=new Date().toISOString().split('T')[0];
  if(VID)loadV();
});

function loadV(){
  API.call('getVehicle',{id:VID}).then(function(r){
    if(!r.success)return;VD=r.data;var v=r.data;
    document.getElementById('dp').textContent=v.plate_number;
    document.getElementById('dm').textContent=v.vehicle_type+' · '+(v.center_name||'');
    var s=v.worstStatus||'NORMAL';
    var bm={OVERDUE:'b-red',DUE_SOON:'b-orange',APPOINTED:'b-blue',NORMAL:'b-green'};
    var lm={OVERDUE:'เกินกำหนด',DUE_SOON:'ใกล้ครบกำหนด',APPOINTED:'นัดแล้ว',NORMAL:'ปกติ'};
    document.getElementById('db').innerHTML='<span class="badge '+(bm[s]||'b-green')+'">'+(lm[s]||s)+'</span>';
    document.getElementById('ic').innerHTML=
      '<div class="icard-hdr">🚗 ข้อมูลรถ</div>'
      +irow('📋','ทะเบียน',v.plate_number)
      +irow('🚙','ประเภท',v.vehicle_type)
      +irow('🏢','ศูนย์',v.center_name||'—')
      +irow('👤','ผู้ครอบครอง',v.primary_driver_name||'—')
      +irow('📅','วันรับรถ',tDate(v.delivered_at))
      +irow('📅','หมดสัญญา',tDate(v.lease_expires_at))
      +irow('🛣️','เลขไมล์',Number(v.current_mileage||0).toLocaleString()+' กม.')
      +irow('🗓️','อัปเดตไมล์',tDate(v.mileage_updated_at));
    document.getElementById('cm').textContent=Number(v.current_mileage||0).toLocaleString();
    document.getElementById('nm').value=v.current_mileage||'';
    renderM(v.maintenance||[]);
    renderH(v.serviceRecords||[]);
  });
}

function irow(ic,lb,vl){return'<div class="irow"><div class="irow-icon">'+ic+'</div><div><div class="irow-label">'+lb+'</div><div class="irow-val">'+vl+'</div></div></div>';}

function renderM(list){
  var el=document.getElementById('ml');
  if(!list.length){el.innerHTML='<div class="empty">ไม่มีข้อมูล</div>';return;}
  var order={OVERDUE:0,DUE_SOON:1,APPOINTED:2,NORMAL:3,COMPLETED:4};
  list.sort(function(a,b){return(order[a.status]||5)-(order[b.status]||5);});
  el.innerHTML=list.filter(function(m){return m.status!=='COMPLETED';}).map(function(m){
    var s=m.status;
    var cc={OVERDUE:'mcard-red',DUE_SOON:'mcard-orange',APPOINTED:'mcard-blue',NORMAL:'mcard-green'};
    var co={OVERDUE:'var(--danger)',DUE_SOON:'var(--warning)',APPOINTED:'var(--p600)',NORMAL:'var(--success)'};
    var bg={OVERDUE:'var(--danger-bg)',DUE_SOON:'var(--warning-bg)',APPOINTED:'var(--p100)',NORMAL:'var(--success-bg)'};
    var bm={OVERDUE:'b-red',DUE_SOON:'b-orange',APPOINTED:'b-blue',NORMAL:'b-green'};
    var sl={OVERDUE:'เกินกำหนด',DUE_SOON:'ใกล้ครบ',APPOINTED:'นัดแล้ว',NORMAL:'ปกติ'};
    var km=VD?VD.current_mileage||0:0;
    var pct=m.dueMileage?Math.min(100,Math.round(km/m.dueMileage*100)):0;
    var pc=pct>=100?'pf-red':pct>=85?'pf-orange':'pf-blue';
    return '<div class="mcard '+(cc[s]||'mcard-green')+'"><div class="mcard-stripe"></div>'
      +'<div class="mcard-head"><div class="mcard-icon" style="background:'+bg[s]+';color:'+co[s]+'">🔧</div>'
      +'<div style="flex:1"><div class="mcard-title">'+(m.typeLabel||ML[m.type]||m.type)+'</div>'
      +(m.remainingDays!=null?'<div class="mcard-sub">'+(m.remainingDays<0?'เกิน '+Math.abs(m.remainingDays)+' วัน':'อีก '+m.remainingDays+' วัน')+'</div>':'')
      +'</div><span class="badge '+(bm[s]||'b-green')+'">'+(sl[s]||s)+'</span></div>'
      +'<div class="mcard-body">'
      +(m.dueMileage?'<div class="dual-prog"><div><div class="dp-lbl">ระยะทาง</div>'
        +'<div class="prog-track"><div class="prog-fill '+pc+'" style="width:'+pct+'%"></div></div>'
        +'<div style="font-size:10px;color:var(--t3);margin-top:3px">'+Number(km).toLocaleString()+' / '+Number(m.dueMileage).toLocaleString()+' กม.</div></div>'
        +(m.dueDate?'<div><div class="dp-lbl">ครบกำหนด</div><div style="font-size:13px;font-weight:600;margin-top:6px;color:'+co[s]+'">'+tDate(m.dueDate)+'</div></div>':'')
        +'</div>':'')
      +(s!=='APPOINTED'?'<div class="appt-box"><div class="appt-lbl">📅 ตั้งวันนัดหมาย</div>'
        +'<div style="display:flex;gap:8px;align-items:center"><input type="date" id="a-'+m.type+'" class="finput" style="flex:1">'
        +'<button class="btn btn-primary btn-sm" onclick="setA(\''+m.type+'\')">บันทึก</button></div></div>':'')
      +'</div></div>';
  }).join('');
}

function renderH(list){
  var el=document.getElementById('hl');
  if(!list.length){el.innerHTML='<div class="empty"><div class="empty-icon">📋</div>ยังไม่มีประวัติ</div>';return;}
  el.innerHTML=list.map(function(r){
    return '<div class="icard" style="margin-bottom:10px"><div class="icard-hdr">📋 '+tDate(r.serviced_at)+' · '+Number(r.mileage_at_service||0).toLocaleString()+' กม.</div>'
      +'<div style="padding:12px 16px"><div style="font-size:13px;font-weight:600;color:var(--t1)">'+(ML[r.maintenance_type]||r.maintenance_type||'—')+'</div>'
      +(r.tasks?'<div style="font-size:12px;color:var(--t2);margin-top:4px">'+r.tasks+'</div>':'')
      +(r.notes?'<div style="font-size:12px;color:var(--t3);margin-top:4px;font-style:italic">'+r.notes+'</div>':'')
      +'</div></div>';
  }).join('');
}

function setA(t){var d=document.getElementById('a-'+t).value;if(!d){alert('กรุณาเลือกวันที่');return;}
  API.post('setAppointment',{vehicleId:VID,maintenanceType:t,appointmentDate:d}).then(function(r){if(r.success){alert('บันทึกนัดหมายเรียบร้อย ✅');loadV();}});}

function saveMile(){var m=parseInt(document.getElementById('nm').value),d=document.getElementById('md').value,n=document.getElementById('mn').value;
  if(!m||m<0){alert('กรุณากรอกเลขไมล์');return;}
  API.post('updateMileage',{vehicleId:VID,mileage:m,recordedAt:d,note:n}).then(function(r){if(r.success){alert('บันทึกสำเร็จ ✅');loadV();}});}

function showT(id,el){['info','maint','hist','mile'].forEach(function(t){document.getElementById('tab-'+t).style.display=t===id?'block':'none';});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');}
</script>
</body>
</html>
