<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FleetSHE — รายละเอียดรถ</title>
<link rel="stylesheet" href="style.css">
<style>
.car-hero{height:180px;background:linear-gradient(135deg,#EBF3FC,#F0F6FF);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.car-hero img{width:100%;height:100%;object-fit:contain;padding:12px;}
.car-hero-tag{position:absolute;bottom:10px;left:12px;background:rgba(15,52,96,.75);color:#fff;font-size:11px;padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px);}
.appt-box{background:var(--primary-bg);border:1.5px solid var(--primary);border-radius:var(--r-md);padding:14px;margin-top:10px;}
.appt-label{font-size:12px;font-weight:600;color:var(--primary);margin-bottom:8px;}
</style>
</head>
<body>
<div id="app">
<main class="main" style="margin-left:0">
  <div class="detail-hdr">
    <button class="back-btn" onclick="history.back()">←</button>
    <div style="flex:1"><div class="dh-plate" id="dh-plate">—</div><div class="dh-model" id="dh-model">—</div></div>
    <div id="dh-badge"></div>
    <button onclick="Auth.logout()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;margin-left:6px;">🚪</button>
  </div>

  <!-- รูปรถ -->
  <div class="car-hero" id="car-hero">
    <img id="car-img" src="" alt="รถยนต์" onerror="this.parentElement.style.display='none'">
    <span class="car-hero-tag" id="car-center"></span>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="showTab('info',this)">ข้อมูลรถ</div>
    <div class="tab" onclick="showTab('maint',this)">รอบบำรุง</div>
    <div class="tab" onclick="showTab('history',this)">ประวัติ</div>
    <div class="tab" onclick="showTab('mileage',this)">อัปเดตไมล์</div>
  </div>

  <div class="page-body">
    <div id="tab-info">
      <div id="info-card" class="info-card"><div class="loading-state">⏳ กำลังโหลด...</div></div>
    </div>
    <div id="tab-maint" style="display:none"><div id="maint-list"></div></div>
    <div id="tab-history" style="display:none">
      <div id="history-list"></div>
      <div class="mt-12"><button class="btn btn-primary btn-block" onclick="showTab('history',document.querySelectorAll(\'.tab\')[2])">+ บันทึกการเข้ารับบริการ</button></div>
    </div>
    <div id="tab-mileage" style="display:none">
      <div class="card">
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:13px;color:var(--text-3);margin-bottom:4px">เลขไมล์ปัจจุบัน</div>
          <div id="cur-mileage" style="font-size:36px;font-weight:700;color:var(--primary)">—</div>
          <div style="font-size:12px;color:var(--text-3)">กิโลเมตร</div>
        </div>
        <div class="form-group">
          <label class="form-label">เลขไมล์ใหม่ (กม.)</label>
          <input type="number" id="new-mileage" class="form-input" placeholder="กรอกเลขไมล์" style="font-size:20px;font-weight:600;text-align:center">
        </div>
        <div class="form-group">
          <label class="form-label">วันที่อัปเดต</label>
          <input type="date" id="mileage-date" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">หมายเหตุ</label>
          <input type="text" id="mileage-note" class="form-input" placeholder="เช่น กลับจากภาคสนาม">
        </div>
        <button class="btn btn-primary btn-block btn-lg" onclick="saveMileage()">💾 บันทึกเลขไมล์</button>
      </div>
    </div>
  </div>
</main>
</div>
<script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script>
<script>
var SEDAN='https://drive.google.com/thumbnail?id=1l-jLDSW563Y956T9XCpfMsV3_hkHphHD&sz=w400';
var PICKUP='https://drive.google.com/thumbnail?id=1zH8t-zhoV--y8-V3TD7C4gZoGVvqXI22&sz=w400';
function carImg(t){if(!t)return PICKUP;return t.toLowerCase().includes('เก๋ง')||t.toLowerCase().includes('sedan')?SEDAN:PICKUP;}
var MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDate(s){if(!s)return'—';try{var d=new Date(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+(d.getFullYear()+543);}catch(e){return s;}}
var MLAB={INITIAL_1000KM:'ตรวจเช็กระยะ 1,000 กม.แรก',ROUTINE_10K:'ตรวจเช็กตามระยะ (10,000/6เดือน)',TIRE_ROTATION:'สลับยาง',TIRE_REPLACEMENT:'เปลี่ยนยาง',BATTERY_REPLACEMENT:'เปลี่ยนแบตเตอรี่'};
var VID='';var VDATA=null;

document.addEventListener('DOMContentLoaded',function(){
  requireAuth();
  VID=new URLSearchParams(location.search).get('id')||'';
  document.getElementById('mileage-date').value=new Date().toISOString().split('T')[0];
  if(VID)loadV();
});

function loadV(){
  API.call('getVehicle',{id:VID}).then(function(r){
    if(!r.success)return;
    VDATA=r.data;
    var v=r.data;
    // header
    document.getElementById('dh-plate').textContent=v.plate_number;
    document.getElementById('dh-model').textContent=v.vehicle_type+' · '+v.center_name;
    // รูป
    document.getElementById('car-img').src=carImg(v.vehicle_type);
    document.getElementById('car-center').textContent=v.center_name||'';
    // badge
    var s=v.worstStatus||'NORMAL';
    var bm={OVERDUE:'badge-red',DUE_SOON:'badge-amber',APPOINTED:'badge-blue',NORMAL:'badge-green'};
    var lm={OVERDUE:'เกินกำหนด',DUE_SOON:'ใกล้ครบกำหนด',APPOINTED:'นัดแล้ว',NORMAL:'ปกติ'};
    document.getElementById('dh-badge').innerHTML='<span class="badge '+(bm[s]||'badge-green')+'">'+(lm[s]||s)+'</span>';
    // info
    document.getElementById('info-card').innerHTML=
      '<div class="info-hdr">🚗 ข้อมูลรถ</div>'+
      row('📋','ทะเบียน',v.plate_number)+
      row('🚙','ประเภท',v.vehicle_type)+
      row('🏢','ศูนย์วิจัย',v.center_name||'—')+
      row('👤','ผู้ครอบครอง',v.primary_driver_name||'—')+
      row('📅','วันที่รับรถ',thaiDate(v.delivered_at))+
      row('📅','หมดสัญญาเช่า',thaiDate(v.lease_expires_at))+
      row('🛣️','เลขไมล์ล่าสุด',Number(v.current_mileage||0).toLocaleString()+' กม.')+
      row('🗓️','อัปเดตไมล์',thaiDate(v.mileage_updated_at));
    // mileage tab
    document.getElementById('cur-mileage').textContent=Number(v.current_mileage||0).toLocaleString();
    document.getElementById('new-mileage').value=v.current_mileage||'';
    // maintenance
    renderMaint(v.maintenance||[]);
    // history
    renderHistory(v.serviceRecords||[]);
  });
}

function row(icon,label,val){return'<div class="info-row"><div class="info-icon">'+icon+'</div><div><div class="info-label">'+label+'</div><div class="info-val">'+val+'</div></div></div>';}

function renderMaint(list){
  var el=document.getElementById('maint-list');
  if(!list.length){el.innerHTML='<div class="empty-state">ไม่มีข้อมูล</div>';return;}
  var order={OVERDUE:0,DUE_SOON:1,APPOINTED:2,NORMAL:3,COMPLETED:4};
  list.sort(function(a,b){return(order[a.status]||5)-(order[b.status]||5);});
  el.innerHTML=list.map(function(m){
    if(m.status==='COMPLETED')return'';
    var s=m.status;
    var color=s==='OVERDUE'?'var(--red)':s==='DUE_SOON'?'var(--amber)':s==='APPOINTED'?'var(--primary)':'var(--green)';
    var bg=s==='OVERDUE'?'var(--red-bg)':s==='DUE_SOON'?'var(--amber-bg)':s==='APPOINTED'?'var(--primary-bg)':'var(--green-bg)';
    var badge=s==='OVERDUE'?'badge-red':s==='DUE_SOON'?'badge-amber':s==='APPOINTED'?'badge-blue':'badge-green';
    var slabel={OVERDUE:'เกินกำหนด',DUE_SOON:'ใกล้ครบ',APPOINTED:'นัดแล้ว',NORMAL:'ปกติ'}[s]||s;
    var km=VDATA?VDATA.current_mileage||0:0;
    var pct=m.dueMileage?Math.min(100,Math.round(km/m.dueMileage*100)):0;
    var pc=pct>=100?'prog-red':pct>=85?'prog-amber':'prog-blue';
    return '<div class="maint-card">'
      +'<div class="mc-top"><div class="mc-icon" style="background:'+bg+';color:'+color+'">🔧</div>'
      +'<div style="flex:1"><div class="mc-title">'+(m.typeLabel||MLAB[m.type]||m.type)+'</div>'
      +(m.remainingDays!=null?'<div class="mc-sub">'+(m.remainingDays<0?'เกิน '+Math.abs(m.remainingDays)+' วัน':'อีก '+m.remainingDays+' วัน')+'</div>':'')
      +'</div><span class="badge '+badge+'">'+slabel+'</span></div>'
      +'<div class="mc-body">'
      +(m.dueMileage?'<div class="dual-prog">'
        +'<div><div class="dp-label">ระยะทาง</div>'
        +'<div class="prog-track"><div class="prog-fill '+pc+'" style="width:'+pct+'%"></div></div>'
        +'<div style="font-size:10px;color:var(--text-3);margin-top:2px">'+Number(km).toLocaleString()+' / '+Number(m.dueMileage).toLocaleString()+' กม.</div></div>'
        +(m.dueDate?'<div><div class="dp-label">ครบกำหนด</div><div style="font-size:12px;font-weight:600;margin-top:4px;color:'+color+'">'+thaiDate(m.dueDate)+'</div></div>':'')
        +'</div>':'')
      +(s!=='APPOINTED'?'<div class="appt-box"><div class="appt-label">📅 ตั้งวันนัดหมาย</div>'
        +'<div style="display:flex;gap:8px;align-items:center">'
        +'<input type="date" id="appt-'+m.type+'" class="form-input" style="flex:1">'
        +'<button class="btn btn-primary btn-sm" onclick="setAppt(\''+m.type+'\')">บันทึก</button></div></div>':'')
      +'</div></div>';
  }).join('');
}

function renderHistory(list){
  var el=document.getElementById('history-list');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div>ยังไม่มีประวัติ</div>';return;}
  el.innerHTML=list.map(function(r){
    return '<div class="info-card" style="margin-bottom:10px">'
      +'<div class="info-hdr">📋 '+thaiDate(r.serviced_at)+' · '+Number(r.mileage_at_service||0).toLocaleString()+' กม.</div>'
      +'<div style="padding:12px 16px">'
      +'<div style="font-size:13px;font-weight:600;color:var(--text-1)">'+(MLAB[r.maintenance_type]||r.maintenance_type||'—')+'</div>'
      +(r.tasks?'<div style="font-size:12px;color:var(--text-2);margin-top:4px">'+r.tasks+'</div>':'')
      +(r.notes?'<div style="font-size:12px;color:var(--text-3);margin-top:4px;font-style:italic">'+r.notes+'</div>':'')
      +'</div></div>';
  }).join('');
}

function setAppt(type){
  var d=document.getElementById('appt-'+type).value;
  if(!d){alert('กรุณาเลือกวันที่');return;}
  API.post('setAppointment',{vehicleId:VID,maintenanceType:type,appointmentDate:d})
    .then(function(r){if(r.success){alert('บันทึกนัดหมายเรียบร้อย ✅');loadV();}});
}

function saveMileage(){
  var m=parseInt(document.getElementById('new-mileage').value);
  var d=document.getElementById('mileage-date').value;
  var n=document.getElementById('mileage-note').value;
  if(!m||m<0){alert('กรุณากรอกเลขไมล์');return;}
  API.post('updateMileage',{vehicleId:VID,mileage:m,recordedAt:d,note:n})
    .then(function(r){if(r.success){alert('บันทึกสำเร็จ ✅');loadV();}});
}

function showTab(id,el){
  ['info','maint','history','mileage'].forEach(function(t){document.getElementById('tab-'+t).style.display=t===id?'block':'none';});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
}
</script>
</body>
</html>
