<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Intelligent Fleet SHE&amp;En — รายงานผู้บริหาร</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ══ Vehicle selector ══ */
.vsel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
@media(min-width:480px){.vsel-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:768px){.vsel-grid{grid-template-columns:repeat(4,1fr);}}
.vsel-card{
  background:var(--surface);border:2px solid var(--border);border-radius:12px;
  padding:10px 12px;cursor:pointer;transition:all .18s;text-align:center;
}
.vsel-card:hover{border-color:var(--p600);transform:translateY(-1px);box-shadow:var(--sh2);}
.vsel-card.active{border-color:var(--p600);background:var(--p100);}
[data-theme="dark"] .vsel-card.active{background:var(--p100);}
.vsel-plate{font-size:15px;font-weight:800;font-family:monospace;color:var(--t1);letter-spacing:1px;}
.vsel-model{font-size:10px;color:var(--t3);margin-top:2px;}
.vsel-center{font-size:10px;color:var(--t4);margin-top:1px;}
.vsel-badge{margin-top:5px;}

/* ══ Report header card ══ */
.rpt-header{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh1);
}
.rpt-header-row{display:flex;align-items:center;gap:12px;}
.rpt-plate-box{
  background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
  padding:4px 12px;font-size:20px;font-weight:800;font-family:monospace;
  color:var(--t1);letter-spacing:1.5px;flex-shrink:0;
}
.rpt-info{flex:1;min-width:0;}
.rpt-model{font-size:14px;font-weight:600;color:var(--t1);}
.rpt-center{font-size:12px;color:var(--t3);margin-top:2px;}
.rpt-donut-wrap{flex-shrink:0;text-align:center;}
.rpt-donut{position:relative;width:60px;height:60px;}
.rpt-donut svg{transform:rotate(-90deg);}
.rpt-donut-pct{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--t1);line-height:1;
}
.rpt-donut-lbl{font-size:9px;color:var(--t3);margin-top:2px;}

/* ══ Tab bar ══ */
.rpt-tabs{display:flex;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.rpt-tab{flex:1;padding:10px 8px;font-size:12px;font-weight:500;color:var(--t3);cursor:pointer;text-align:center;transition:all .15s;border:none;background:none;}
.rpt-tab.active{background:var(--p600);color:#fff;font-weight:600;}
[data-theme="dark"] .rpt-tab.active{background:#2E78E4;}

/* ══ Timeline ══ */
.tl-wrap{padding:4px 0;}
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:36px;}
.tl-dot{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;z-index:1;
  border:2.5px solid var(--surface);
  box-shadow:0 2px 8px rgba(11,94,215,.15);
}
.tl-dot-done{background:#EDFAF3;color:#1C8A45;}
.tl-dot-pending{background:#FFF4E5;color:#C96F00;}
.tl-dot-plan{background:var(--bg);color:var(--t4);}
.tl-line{width:2px;flex:1;background:var(--border);margin-top:4px;}
.tl-item:last-child .tl-line{display:none;}
.tl-content{flex:1;padding-top:4px;}
.tl-date{font-size:11px;color:var(--t3);margin-bottom:3px;font-weight:500;}
.tl-title{font-size:14px;font-weight:600;color:var(--t1);}
.tl-row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap;}
.tl-km{font-size:12px;color:var(--t3);}
.tl-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;}
.tl-badge-done{background:#EDFAF3;color:#1C8A45;border:1px solid #A3E4BF;}
.tl-badge-pending{background:#FFF4E5;color:#C96F00;border:1px solid #FFD99B;}
.tl-badge-late{background:#FEF0EF;color:#E5322D;border:1px solid #FBCFCE;}
.tl-badge-plan{background:var(--bg);color:var(--t3);border:1px solid var(--border);}
[data-theme="dark"] .tl-badge-done{background:#002e1e;color:#3dffc0;border-color:#005c3a;}
[data-theme="dark"] .tl-badge-pending{background:#2e1e00;color:#ffd166;border-color:#5c3a00;}
.tl-tasks{font-size:12px;color:var(--t2);margin-top:6px;background:var(--bg);border-radius:8px;padding:8px 10px;line-height:1.6;}

/* ══ Plan tab ══ */
.plan-item{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
}
.plan-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.plan-body{flex:1;min-width:0;}
.plan-title{font-size:13px;font-weight:600;color:var(--t1);}
.plan-sub{font-size:11px;color:var(--t3);margin-top:3px;}
.plan-right{text-align:right;flex-shrink:0;}
.plan-due{font-size:12px;font-weight:600;color:var(--t1);}
.plan-km{font-size:10px;color:var(--t3);margin-top:2px;}

/* ══ Summary tab ══ */
.sum-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-light);}
.sum-row:last-child{border-bottom:none;}
.sum-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0;}
.sum-label{flex:1;font-size:13px;color:var(--t1);font-weight:500;}
.sum-val{font-size:12px;color:var(--t3);}
.sum-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}

/* ══ Export ══ */
.export-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.export-row .fgroup{flex:1;min-width:120px;margin:0;}
.btn-excel{background:#1D6F42;color:#fff;border:none;font-size:12px;font-weight:600;padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .18s;flex-shrink:0;margin-top:20px;}
.btn-excel:hover{background:#155232;}
.btn-pdf{background:#C0392B;color:#fff;border:none;font-size:12px;font-weight:600;padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .18s;flex-shrink:0;margin-top:20px;}
.btn-pdf:hover{background:#962d22;}

/* ══ Empty / loading ══ */
.rpt-empty{text-align:center;padding:40px 20px;color:var(--t3);}
.rpt-empty-icon{font-size:40px;margin-bottom:8px;opacity:.5;}

/* ══ Print ══ */
@media print{
  .topbar,.sidebar,.bottom-nav,.overlay,.export-row,.rpt-tabs,.vsel-grid{display:none!important;}
  .main{margin-left:0!important;padding-bottom:0!important;}
  .rpt-header,.plan-item,.sum-row{page-break-inside:avoid;}
  body{background:#fff!important;color:#000!important;}
  @page{margin:15mm;size:A4;}
}
</style>
</head>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
var MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function tDate(s){
  if(!s) return '—';
  try{ var d=new Date(s); return d.getDate()+' '+MS[d.getMonth()]+' '+(d.getFullYear()+543); }
  catch(e){ return s; }
}

var TYPE_ICON  = {INITIAL_1000KM:'🔑',ROUTINE_10K:'🔧',TIRE_ROTATION:'🔄',TIRE_REPLACEMENT:'🛞',BATTERY_REPLACEMENT:'🔋'};
var TYPE_LABEL = {INITIAL_1000KM:'ตรวจเช็กระยะ 1,000 กม.แรก',ROUTINE_10K:'ตรวจเช็กตามระยะ (10,000/6 เดือน)',TIRE_ROTATION:'สลับยาง',TIRE_REPLACEMENT:'เปลี่ยนยาง',BATTERY_REPLACEMENT:'เปลี่ยนแบตเตอรี่'};
var TYPE_COLOR = {INITIAL_1000KM:'var(--p600)',ROUTINE_10K:'var(--success)',TIRE_ROTATION:'var(--warning)',TIRE_REPLACEMENT:'var(--danger)',BATTERY_REPLACEMENT:'#8B5CF6'};
var TYPE_BG    = {INITIAL_1000KM:'var(--p100)',ROUTINE_10K:'var(--success-bg)',TIRE_ROTATION:'var(--warning-bg)',TIRE_REPLACEMENT:'var(--danger-bg)',BATTERY_REPLACEMENT:'#F3E8FF'};

var allVehicles = [];
var curVehicle  = null;
var curAudit    = null;

document.addEventListener('DOMContentLoaded', function(){
  requireAuth();
  var u = Auth.getUser();
  if(u){
    var ini = u.name ? u.name.split(' ').map(function(w){return w[0];}).join('').substring(0,2) : 'AD';
    document.getElementById('sb-av').textContent = ini;
    document.getElementById('sb-nm').textContent = u.name;
    document.getElementById('sb-rl').textContent = roleLabel(u.role);
  }
  API.call('getCenters').then(function(r){
    if(!r.success) return;
    var s = document.getElementById('rc');
    r.data.forEach(function(c){
      var o = document.createElement('option');
      o.value = c.id; o.textContent = c.name; s.appendChild(o);
    });
  });
  loadVehicles();
});

/* ══ โหลดรายการรถ ══ */
function loadVehicles(){
  var centerId = document.getElementById('rc').value;
  document.getElementById('vsel-wrap').innerHTML = '<div class="rpt-empty"><div class="rpt-empty-icon">⏳</div>กำลังโหลด...</div>';
  document.getElementById('rpt-area').style.display = 'none';

  API.call('getVehicles', {centerId: centerId === 'ALL' ? null : centerId}).then(function(r){
    allVehicles = r.success ? r.data || [] : [];
    renderVselGrid(allVehicles);
  });
}

function renderVselGrid(vehicles){
  if(!vehicles.length){
    document.getElementById('vsel-wrap').innerHTML = '<div class="rpt-empty"><div class="rpt-empty-icon">🚗</div>ไม่พบรถในศูนย์นี้</div>';
    return;
  }
  var html = '<div class="vsel-grid">';
  vehicles.forEach(function(v, i){
    var s = v.worstStatus || 'NORMAL';
    var bmap = {OVERDUE:'badge-late',DUE_SOON:'badge-warn',APPOINTED:'badge-appt',NORMAL:'badge-ok'};
    var lmap = {OVERDUE:'❌ ล่าช้า',DUE_SOON:'⚠️ ใกล้ถึง',APPOINTED:'📅 นัดแล้ว',NORMAL:'✅ ปกติ'};
    // ต้องนิยาม badge class ด้านใน inline
    var bcolors = {
      'badge-late':'background:#fff0f0;color:#c0392b;border:1px solid #fbc6c6',
      'badge-warn':'background:#fffbea;color:#9a6700;border:1px solid #ffe082',
      'badge-appt':'background:#eef3ff;color:#3d5fc7;border:1px solid #c3d0f7',
      'badge-ok':'background:#e6faf4;color:#0a7c5c;border:1px solid #b2eeda',
    };
    html +=
      '<div class="vsel-card" id="vs-'+i+'" onclick="selectVehicle('+i+')">'
      +'<div class="vsel-plate">'+v.plate_number+'</div>'
      +'<div class="vsel-model">'+(v.brand||'')+' '+(v.model||'')+'</div>'
      +'<div class="vsel-center">'+(v.center_name||'')+'</div>'
      +'<div class="vsel-badge" style="margin-top:5px">'
      +'<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;'+bcolors[bmap[s]||'badge-ok']+'">'+lmap[s]+'</span>'
      +'</div>'
      +'</div>';
  });
  html += '</div>';
  document.getElementById('vsel-wrap').innerHTML = html;
}

/* ══ เลือกรถ ══ */
function selectVehicle(idx){
  // อัปเดต active state
  document.querySelectorAll('.vsel-card').forEach(function(c){ c.classList.remove('active'); });
  document.getElementById('vs-'+idx).classList.add('active');

  var v = allVehicles[idx];
  curVehicle = v;

  // โหลด service records + audit พร้อมกัน
  document.getElementById('rpt-area').style.display = 'none';
  Promise.all([
    API.call('getVehicle', {id: v.id}),
    API.call('getAuditReport', {centerId: v.center_id})
  ]).then(function(results){
    var vDetail = results[0].success ? results[0].data : v;
    var auditData = results[1].success ? results[1].data || [] : [];
    curAudit = auditData.find(function(a){ return a.vehicleId === v.id; }) || null;
    renderReport(vDetail, curAudit);
  });
}

/* ══ Render รายงานรถคัดเลือก ══ */
function renderReport(v, audit){
  // คำนวณ score
  var items = audit ? audit.items || [] : [];
  var ok    = items.filter(function(it){ return it.onTime === true; }).length;
  var late  = items.filter(function(it){ return it.onTime === false; }).length;
  var scored = ok + late;
  var pct   = scored > 0 ? Math.round(ok/scored*100) : null;
  var circumference = 2 * Math.PI * 24; // r=24

  // header
  document.getElementById('rpt-plate').textContent  = v.plate_number;
  document.getElementById('rpt-model').textContent  = (v.brand||'')+' '+(v.model||'')+(v.color?' · '+v.color:'');
  document.getElementById('rpt-center').textContent = v.center_name||'';
  document.getElementById('rpt-km-badge').innerHTML =
    '<span style="font-size:12px;color:var(--t3)">🛣️ '
    +Number(v.current_mileage||0).toLocaleString()+' กม. · รับรถ '+tDate(v.delivered_at)+'</span>';

  // donut
  var arc = document.getElementById('rpt-donut-arc');
  if(pct !== null){
    var dashLen = (pct/100) * circumference;
    arc.setAttribute('stroke-dasharray', dashLen+' '+(circumference-dashLen));
    arc.setAttribute('stroke', pct>=80?'#06d6a0':pct>=50?'#ffd166':'#ff6b6b');
    document.getElementById('rpt-pct').textContent = pct+'%';
  } else {
    arc.setAttribute('stroke-dasharray','0 '+circumference);
    document.getElementById('rpt-pct').textContent = '—';
  }

  // render ทุก tab
  renderHistTab(v.serviceRecords||[], items);
  renderPlanTab(items, v);
  renderSumTab(items);

  document.getElementById('rpt-area').style.display = 'block';
  // scroll ไปที่ report
  document.getElementById('rpt-area').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ══ Tab: ประวัติ ══ */
function renderHistTab(records, auditItems){
  var el = document.getElementById('tl-hist');
  if(!records.length){
    el.innerHTML = '<div class="rpt-empty"><div class="rpt-empty-icon">📋</div>ยังไม่มีประวัติการเข้ารับบริการ</div>';
    return;
  }
  records.sort(function(a,b){ return new Date(b.serviced_at)-new Date(a.serviced_at); });

  el.innerHTML = records.map(function(r){
    var type  = r.maintenance_type || 'ROUTINE_10K';
    var icon  = TYPE_ICON[type]  || '🔧';
    var color = TYPE_COLOR[type] || 'var(--p600)';
    var bg    = TYPE_BG[type]    || 'var(--p100)';
    var label = TYPE_LABEL[type] || type;

    // หา audit item ที่ตรงกัน
    var auditItem = auditItems.find(function(it){ return it.type === type; });
    var badgeHtml = '';
    if(auditItem){
      if(auditItem.onTime === true)
        badgeHtml = '<span class="tl-badge tl-badge-done">✅ ตามแผน</span>';
      else if(auditItem.onTime === false){
        var delay = [];
        if(auditItem.delayDays>0) delay.push('ล่าช้า '+auditItem.delayDays+' วัน');
        if(auditItem.delayKm>0)   delay.push(auditItem.delayKm.toLocaleString()+' กม.');
        badgeHtml = '<span class="tl-badge tl-badge-late">❌ ล่าช้า'+(delay.length?' ('+delay.join('/')+')'):'')+'</span>';
      }
    } else {
      badgeHtml = '<span class="tl-badge tl-badge-done">เสร็จสิ้น</span>';
    }

    return '<div class="tl-item">'
      +'<div class="tl-left">'
      +'<div class="tl-dot tl-dot-done" style="background:'+bg+';color:'+color+'">'+icon+'</div>'
      +'<div class="tl-line"></div>'
      +'</div>'
      +'<div class="tl-content">'
      +'<div class="tl-date">'+tDate(r.serviced_at)+'</div>'
      +'<div class="tl-title">'+label+'</div>'
      +'<div class="tl-row">'
      +'<span class="tl-km">🛣️ '+Number(r.mileage_at_service||0).toLocaleString()+' กม.</span>'
      +badgeHtml
      +'</div>'
      +(r.tasks?'<div class="tl-tasks">'+r.tasks+'</div>':'')
      +'</div></div>';
  }).join('');
}

/* ══ Tab: แผนถัดไป ══ */
function renderPlanTab(items, v){
  var el = document.getElementById('plan-list');
  if(!items.length){ el.innerHTML='<div class="rpt-empty">ไม่มีข้อมูล</div>'; return; }

  var planned = items.filter(function(it){ return it.status !== 'COMPLETED'; });
  planned.sort(function(a,b){
    var p = {OVERDUE:0,DUE_SOON:1,APPOINTED:2,NORMAL:3};
    return (p[a.status]||4)-(p[b.status]||4);
  });

  el.innerHTML = planned.map(function(it){
    var type  = it.type;
    var icon  = TYPE_ICON[type]  || '🔧';
    var color = TYPE_COLOR[type] || 'var(--p600)';
    var bg    = TYPE_BG[type]    || 'var(--p100)';
    var label = TYPE_LABEL[type] || type;

    var statusBadge = '';
    var statusColor = 'var(--t3)';
    if(it.status==='OVERDUE')        { statusBadge='❌ เกินกำหนด'; statusColor='var(--danger)'; }
    else if(it.status==='DUE_SOON')  { statusBadge='⚠️ ใกล้ถึง';  statusColor='var(--warning)'; }
    else if(it.status==='APPOINTED') { statusBadge='📅 นัดแล้ว';  statusColor='var(--p600)'; }
    else                             { statusBadge='🟢 ปกติ';      statusColor='var(--success)'; }

    var sub = [];
    if(it.remainingDays!=null) sub.push(it.remainingDays<0?'เกิน '+Math.abs(it.remainingDays)+' วัน':'อีก '+it.remainingDays+' วัน');
    if(it.remainingKm!=null)   sub.push(it.remainingKm<0?'เกิน '+Math.abs(it.remainingKm).toLocaleString()+' กม.':'เหลือ '+it.remainingKm.toLocaleString()+' กม.');

    return '<div class="plan-item">'
      +'<div class="plan-icon" style="background:'+bg+';color:'+color+'">'+icon+'</div>'
      +'<div class="plan-body">'
      +'<div class="plan-title">'+label+'</div>'
      +'<div class="plan-sub">'+sub.join(' · ')+'</div>'
      +'</div>'
      +'<div class="plan-right">'
      +'<div class="plan-due" style="color:'+statusColor+'">'+statusBadge+'</div>'
      +(it.dueDate?'<div class="plan-km">'+tDate(it.dueDate)+'</div>':'')
      +(it.dueMileage?'<div class="plan-km">'+Number(it.dueMileage).toLocaleString()+' กม.</div>':'')
      +'</div>'
      +'</div>';
  }).join('');
}

/* ══ Tab: สรุปรายการ ══ */
function renderSumTab(items){
  var el = document.getElementById('sum-list');
  var types = ['INITIAL_1000KM','ROUTINE_10K','TIRE_ROTATION','TIRE_REPLACEMENT','BATTERY_REPLACEMENT'];
  el.innerHTML = types.map(function(type){
    var it = items.find(function(x){ return x.type===type; });
    var label = TYPE_LABEL[type];
    var icon  = TYPE_ICON[type] || '🔧';
    if(!it) return '';

    var badge='', badgeStyle='';
    if(it.status==='COMPLETED'||it.onTime===true){
      badge='ตามแผน'; badgeStyle='background:#EDFAF3;color:#1C8A45;border:1px solid #A3E4BF';
    } else if(it.onTime===false){
      badge='ล่าช้า'; badgeStyle='background:#FEF0EF;color:#E5322D;border:1px solid #FBCFCE';
    } else if(it.status==='OVERDUE'){
      badge='เกินกำหนด'; badgeStyle='background:#FEF0EF;color:#E5322D;border:1px solid #FBCFCE';
    } else if(it.status==='DUE_SOON'){
      badge='ใกล้ถึง'; badgeStyle='background:#FFF4E5;color:#C96F00;border:1px solid #FFD99B';
    } else if(it.status==='APPOINTED'){
      badge='นัดหมาย'; badgeStyle='background:#eef3ff;color:#3d5fc7;border:1px solid #c3d0f7';
    } else {
      badge='ปกติ'; badgeStyle='background:#EDFAF3;color:#1C8A45;border:1px solid #A3E4BF';
    }

    var lastSvc = it.lastService ? tDate(it.lastService) : 'ยังไม่เคย';
    var nextDue = it.dueDate ? tDate(it.dueDate) : (it.dueMileage ? Number(it.dueMileage).toLocaleString()+' กม.' : '—');

    return '<div class="sum-row">'
      +'<div class="sum-icon">'+icon+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:13px;font-weight:600;color:var(--t1)">'+label+'</div>'
      +'<div style="font-size:11px;color:var(--t3);margin-top:2px">ล่าสุด: '+lastSvc+' · ถัดไป: '+nextDue+'</div>'
      +'</div>'
      +'<span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;'+badgeStyle+'">'+badge+'</span>'
      +'</div>';
  }).join('');
}

/* ══ Tab switch ══ */
function showRptTab(id, el){
  ['hist','plan','sum'].forEach(function(t){
    document.getElementById('tab-'+t).style.display = t===id ? 'block' : 'none';
  });
  document.querySelectorAll('.rpt-tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
}

/* ══ Export Excel ══ */
function exportExcel(){
  if(!curAudit || !curVehicle){ alert('กรุณาเลือกรถก่อน'); return; }
  var rows=[
    ['Intelligent Fleet SHE&En — รายงานการเข้ารับบริการ'],
    ['รถ: '+curVehicle.plate_number+' '+curVehicle.brand+' '+curVehicle.model],
    ['ศูนย์: '+(curVehicle.center_name||'')],
    ['วันที่: '+tDate(new Date().toISOString())],
    [],
    ['ประเภทบำรุงรักษา','เข้ารับบริการล่าสุด','สถานะ','ล่าช้า(วัน)','ล่าช้า(กม.)','กำหนดถัดไป']
  ];
  (curAudit.items||[]).forEach(function(it){
    var status = it.onTime===true?'ตามแผน':it.onTime===false?'ล่าช้า':(it.status==='DUE_SOON'?'ใกล้ถึง':'ยังไม่ทำ');
    if(it.status==='APPOINTED') status='นัดหมาย';
    rows.push([TYPE_LABEL[it.type]||it.type, it.lastService?tDate(it.lastService):'ยังไม่เคย',
      status, it.delayDays>0?it.delayDays:'', it.delayKm>0?it.delayKm:'',
      it.dueDate?tDate(it.dueDate):(it.dueMileage?Number(it.dueMileage).toLocaleString()+' กม.':'')]);
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:30},{wch:18},{wch:14},{wch:12},{wch:12},{wch:18}];
  ws['!merges'] = [{s:{r:0,c:0},e:{r:0,c:5}},{s:{r:1,c:0},e:{r:1,c:5}},{s:{r:2,c:0},e:{r:2,c:5}},{s:{r:3,c:0},e:{r:3,c:5}}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, curVehicle.plate_number);
  XLSX.writeFile(wb, 'fleet_'+curVehicle.plate_number+'_'+new Date().toISOString().split('T')[0]+'.xlsx');
}

/* ══ Export PDF ══ */
function exportPDF(){
  if(!curVehicle){ alert('กรุณาเลือกรถก่อน'); return; }
  // ขยาย tab สรุปรายการก่อน print
  showRptTab('sum', document.querySelectorAll('.rpt-tab')[2]);
  var title = document.title;
  document.title = 'รายงาน '+curVehicle.plate_number+' — '+tDate(new Date().toISOString());
  window.print();
  document.title = title;
}

function openSB(){ document.getElementById('sb').classList.add('open'); document.getElementById('ov').classList.add('show'); }
function closeSB(){ document.getElementById('sb').classList.remove('open'); document.getElementById('ov').classList.remove('show'); }
</script>
